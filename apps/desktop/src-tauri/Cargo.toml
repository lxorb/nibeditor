[package]
name = "nib"
version = "0.8.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.82"

[lib]
name = "nib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# Every module says what it owns, and every command says what it does.
missing_docs = "warn"
# Unsafe is denied everywhere and excepted by name in the five functions that
# call Windows directly: the shell's recent documents list, the two registry
# calls behind Explorer's New menu, WebView2's print engine, and the launch
# trace's question about when this process was created. None of the five has a
# safe wrapper to use instead, and anything new that wants unsafe has to say so
# at the function and say why.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

# Pedantic as the floor, so CI's plain `cargo clippy -- -D warnings` enforces it.
# Anything allowed below is a lint that fights the shape of a Tauri app rather
# than a lint the code fails to meet.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A command's arguments arrive deserialised and owned; that is the signature Tauri
# generates against, and taking them by reference is not an option.
needless_pass_by_value = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what lets the webview load a picture from disk. Without it
# every local image in a note is a broken image.
#
# `unstable` is what a web tab needs: putting a second webview inside a window and
# giving it bounds of its own is behind that flag, and it is the only embedding
# that renders a site the way a browser does. Unstable in Tauri means the API may
# be renamed in a minor release, not that it is experimental in the engine - the
# webview underneath is the same WebView2 or WKWebView the app itself runs in. The
# whole of what nib calls is `Window::add_child`, `Manager::get_webview` and the
# handful of methods on the webview it hands back, all in src/web_tabs.rs, so an
# upstream rename is one file to follow.
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
# Links leave the app the same way on every platform: the system browser on a
# desktop, the browser app on a phone.
tauri-plugin-opener = "2"
# Which platform this is, said once and read from the window. Nothing else tells
# the frontend apart a phone build from the desktop one.
tauri-plugin-os = "2"
# `nib://` links, which is the one way another program on the machine can ask this
# app for something. On both kinds of build: a desktop registers the scheme in its
# installer and a phone in its manifest, and the arriving half is the same code.
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bytes cross the bridge as base64: an export is a Word file, an ePub or a
# picture, and JSON digits would cost six characters a byte. Already in the lock
# file as something tauri builds with, so this adds nothing to the build.
base64 = "0.22"
# A note's body on one of Apple Notes' rows is a gzipped protobuf, and unpacking it
# is `apple_text.rs`. Every platform, although only a Mac has the database: the
# decoding is `std` and this, so keeping it out of the other builds only meant that
# no runner but one compiled a thousand lines of it. The pure-Rust backend, so it
# needs no C compiler and cross-compiles to a phone like anything else.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Desktop only: a second launch should hand its file to the running window, the
# app installs its own updates, and files are chosen and saved in a dialog. A
# phone has none of the three.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
# The `deep-link` feature is what makes a second launch hand over a `nib://` link
# as a link rather than as an argument nothing reads: on Windows and Linux that is
# how a link reaches an app that is already open.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
# An AI provider's key goes in the machine's own keychain and nowhere else: the
# Credential Manager, the Keychain, the Secret Service. Named features rather than
# the defaults, so only the three stores the three desktops have are compiled in -
# `linux-native` is the kernel's session keyring, which forgets a key at logout,
# and `crypto-rust` keeps the Secret Service transport off OpenSSL. A phone has
# EncryptedSharedPreferences instead and a browser has nothing; see secrets.rs.
keyring = { version = "3", default-features = false, features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
# The secret the local endpoint is reached with, from the system's own randomness.
# Already in the lock file as something tauri builds with, so this adds nothing to
# the build. Desktop only, because only a desktop has the endpoint.
getrandom = "0.3"

# Apple Notes keeps its notes in a SQLite database in a group container, which is
# the only way into them: Notes has no export. Bundled so the read does not depend
# on whichever SQLite the machine happens to ship, and a temporary folder to copy
# the database into, because Notes is very likely running while it is read.
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"

# Opened notes belong in the taskbar's own Recent list.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_UI_Shell",
  "Win32_Foundation",
  "Win32_System_Registry",
  # When this process was created, which is the one thing a launch trace cannot
  # measure from inside it: everything before our first line is the machine loading
  # the binary. See trace.rs.
  "Win32_System_Threading",
] }
# PDF export talks to WebView2's print engine directly, and a web tab asks the
# engine to photograph itself. The versions are the ones tauri itself is built
# against, so the handles it hands out line up.
webview2-com = "0.39"
windows-core = "0.61"
# The COM stream `CapturePreview` writes a page's picture into; see `web_shot` in
# web_tabs.rs. It has to be the same `windows` crate webview2-com's own signature
# names, which is 0.61 and not the 0.58 above - two versions of it are already in
# the lock file for that reason - so it comes in under a name of its own rather
# than as a second `windows`. Nothing else in the crate uses it: the five calls
# that reach Windows directly are all on 0.58, and moving them is a change to
# five unsafe functions for no gain.
windows_com = { package = "windows", version = "0.61", features = [
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
] }

[dev-dependencies]
# The tests that touch the disk do it in a folder that cleans itself up. Already
# in the lock file as something tauri builds with, so this costs nothing new.
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
