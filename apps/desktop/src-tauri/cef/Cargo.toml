# nib on its own Chromium: the same app, built a second time against the engine.
#
# **Why a manifest of its own.** The app that ships is built against Tauri 2, and nib's
# own Chromium comes as `tauri-runtime-cef`, which exists for Tauri 3 only. One package
# cannot depend on two major versions of `tauri` by a feature, and a `[patch]` cannot
# turn one into the other, so the engine build is this package: the library's own source,
# `../src/lib.rs`, compiled against Tauri 3 and the engine, with the `cef` feature on.
# Every line of the app is the same file in both builds. The dependency list below the
# marker is the app's own, written by scripts/engine-manifest.ts with the Tauri family
# moved to the pins in `[package.metadata.engine]`, and apps/desktop/test/cef.test.ts
# fails when it is out of date. When Tauri 3 is released the two builds become one
# binary that picks its runtime as it starts (`tauri::DynRuntime`, which is what
# `lib.rs` already writes this build against), and this file goes. See
# ../src/engine.rs and docs/browser.md.
#
# The installers are the default build. This one is the engine the Browser setting
# fetches (see ../src/engine_switch.rs), made by .github/workflows/cef.yml.

[package]
name = "nib-chromium"
version = "0.8.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.95"
description = "nib on its own Chromium: the engine the Browser setting switches to."

# Its own workspace, deliberately: a workspace holding both manifests would unify them
# into one lock file with two Tauris and a Chromium in the app's.
[workspace]

[lib]
name = "nib_lib"
path = "../src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "nib-chromium"
path = "src/main.rs"

[features]
# The library's own switch for the engine it is written against: always on here.
default = ["cef"]
cef = []

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"

# **The pins**, and the only ones: every Tauri crate the engine build takes, and CEF.
# Published crates, all of one release of Tauri 3 - `tauri` and the runtime on their
# alpha.2, the plugins on their alpha.1, which are built against it - so a build gives
# the same answer twice. .github/workflows/cef-bump.yml moves them.
[package.metadata.engine]
tauri = "3.0.0-alpha.2"
tauri-runtime-cef = "3.0.0-alpha.2"
tauri-build = "3.0.0-alpha.1"
plugins = "3.0.0-alpha.1"
cef = "152.3.0"

# ---- below: the app's own dependencies, as scripts/engine-manifest.ts writes them ----

[build-dependencies]
tauri-build = "=3.0.0-alpha.1"

[dependencies]
tauri = { version = "=3.0.0-alpha.2", features = ["protocol-asset", "custom-protocol"] }
tauri-runtime-cef = { version = "=3.0.0-alpha.2", features = ["unstable"] }
cef = { version = "=152.3.0", default-features = false }
dirs = "6"
tauri-plugin-opener = "=3.0.0-alpha.1"
tauri-plugin-os = "=3.0.0-alpha.1"
tauri-plugin-deep-link = "=3.0.0-alpha.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8"
getrandom = "0.3"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-runtime-cef = { version = "=3.0.0-alpha.2", features = ["devtools"] }
tauri-plugin-dialog = "=3.0.0-alpha.1"
tauri-plugin-process = "=3.0.0-alpha.1"
tauri-plugin-single-instance = { version = "=3.0.0-alpha.1", features = ["deep-link"] }
tauri-plugin-updater = "=3.0.0-alpha.1"
keyring = { version = "3", default-features = false, features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
sha2 = "0.10"
window-vibrancy = "0.6"
portable-pty = "0.9"
x25519-dalek = { version = "2", default-features = false, features = [
  "static_secrets",
  "zeroize",
] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
zeroize = "1"
tokio = { version = "1", default-features = false, features = ["time"] }

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "UIApplication",
  "UIResponder",
  "UIScene",
  "UISceneOptions",
  "UISceneSession",
] }

[target.'cfg(target_os = "macos")'.dependencies]
tempfile = "3"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSBundle",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSFileManager",
  "NSGeometry",
  "NSHTTPCookie",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSProgress",
  "NSString",
  "NSURL",
  "NSURLRequest",
  "NSUserDefaults",
  "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSApplication",
  "NSBitmapImageRep",
  "NSButton",
  "NSControl",
  "NSGraphics",
  "NSImage",
  "NSImageRep",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-app-kit",
  "block2",
  "WKContentWorld",
  "WKNavigation",
  "WKDownload",
  "WKFrameInfo",
  "WKHTTPCookieStore",
  "WKNavigationAction",
  "WKNavigationDelegate",
  "WKNavigationResponse",
  "WKPreferences",
  "WKSecurityOrigin",
  "WKSnapshotConfiguration",
  "WKUIDelegate",
  "WKUserContentController",
  "WKUserScript",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebsiteDataStore",
] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
javascriptcore-rs = "=1.1.2"

[target.'cfg(target_os = "windows")'.dependencies]
file-id = "0.2"
windows-registry = "0.6"
windows = { version = "0.58", features = [
  "Win32_UI_Shell",
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Console",
  "Win32_System_ProcessStatus",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_SystemInformation",
] }
webview2-com = "0.38"
windows-core = "0.61"
windows_com = { package = "windows", version = "0.61", features = [
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
] }

[target.'cfg(any(target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
