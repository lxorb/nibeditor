# nib on its own Chromium: the same app, built a second time against the engine.
#
# **Why a manifest of its own.** The app that ships is built against Tauri 2, and
# nib's own Chromium comes as `tauri-runtime-cef`, which only exists for Tauri 3.
# One package cannot depend on two major versions of `tauri` by a feature, and a
# `[patch]` cannot turn one into the other, so the engine build is this package: the
# library's own source, `../src/lib.rs`, compiled here against Tauri 3 and the engine,
# with the `cef` feature on. Every line of the app is the same file in both builds;
# only the dependency list is written twice, and `apps/desktop/test/cef.test.ts` holds
# the two lists to each other. When Tauri 3 is released, the two builds become one
# binary that picks its runtime as it starts (`tauri::DynRuntime`, which is what
# `lib.rs` already writes this build against), and this file goes. See
# src/engine.rs and docs/browser.md.
#
# Nothing that ships builds this. The installers are the default build; this build
# is the engine the setting downloads (see engine_switch.rs), made by
# .github/workflows/cef.yml.

[package]
name = "nib-chromium"
version = "0.8.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.95"
description = "nib on its own Chromium: the engine the Browser setting switches to."

# Its own workspace, deliberately: the app's manifest next door is one too, and a
# workspace holding both would unify their dependencies into one lock file with two
# Tauris in it.
[workspace]

[lib]
name = "nib_lib"
path = "../src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "nib-chromium"
path = "src/main.rs"

[features]
# The library's own switch for which engine it is written against; on, always, in
# this package. See ../Cargo.toml.
default = ["cef"]
cef = []

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"

[build-dependencies]
tauri-build = "=3.0.0-alpha.1"

[dependencies]
tauri = { version = "=3.0.0-alpha.2", features = ["protocol-asset", "custom-protocol"] }
# The engine. Depending on it is what makes this a CEF application: its build script
# stages the Chromium distribution beside the binary, and its attributes are what
# `tauri::Builder::runtime` is handed in src/main.rs.
tauri-runtime-cef = { version = "=3.0.0-alpha.2", features = ["unstable"] }
tauri-plugin-opener = "=3.0.0-alpha.1"
tauri-plugin-os = "=3.0.0-alpha.1"
tauri-plugin-deep-link = "=3.0.0-alpha.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Where the engine's own profiles go, worked out before the app exists; see src/main.rs.
dirs = "6"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-runtime-cef = { version = "=3.0.0-alpha.2", features = ["devtools"] }
tauri-plugin-dialog = "=3.0.0-alpha.1"
tauri-plugin-process = "=3.0.0-alpha.1"
tauri-plugin-single-instance = { version = "=3.0.0-alpha.1", features = ["deep-link"] }
tauri-plugin-updater = "=3.0.0-alpha.1"
keyring = { version = "3", default-features = false, features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
getrandom = "0.3"
window-vibrancy = "0.6"
portable-pty = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSBundle",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSFileManager",
  "NSGeometry",
  "NSHTTPCookie",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSProgress",
  "NSString",
  "NSURL",
  "NSURLRequest",
  "NSUserDefaults",
  "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSApplication",
  "NSBitmapImageRep",
  "NSButton",
  "NSControl",
  "NSGraphics",
  "NSImage",
  "NSImageRep",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-app-kit",
  "block2",
  "WKContentWorld",
  "WKDownload",
  "WKFrameInfo",
  "WKHTTPCookieStore",
  "WKNavigation",
  "WKNavigationAction",
  "WKNavigationDelegate",
  "WKNavigationResponse",
  "WKPreferences",
  "WKSecurityOrigin",
  "WKSnapshotConfiguration",
  "WKUIDelegate",
  "WKUserContentController",
  "WKUserScript",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebsiteDataStore",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.6"
windows = { version = "0.58", features = [
  "Win32_UI_Shell",
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_SystemInformation",
] }
webview2-com = "0.38"
windows-core = "0.61"
windows_com = { package = "windows", version = "0.61", features = [
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

# The same release profile as the app's, so a size or a launch measured here is
# comparable with one measured there.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
