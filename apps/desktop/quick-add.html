<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />

    <!-- The same policy as the editor's page, for the same reasons; one string, written
         in `src/csp.ts` and held to it by `test/csp.test.ts`. First in the head, since a
         policy only governs what is parsed after it. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'sha256-iR2Aqj1jRJSx35wTBtrVLSatm9gSp55tpjHpCB3GAHs=' 'sha256-v841QeTG55+uEpzDrS3ofxcdk/VIgYtt2NynJyqxXik='; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: asset: http://asset.localhost; media-src 'self' data: blob: https: asset: http://asset.localhost; font-src 'self' data:; connect-src 'self' https: wss: ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:* ipc: http://ipc.localhost asset: http://asset.localhost blob: data:; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/icon-256.png" />

    <title>nibeditor</title>

    <!-- The editor page's own ground and its side of the theme, the same lines byte for
         byte, so the hash the policy names for them names these too; see index.html. -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      :where(html) {
        background: #0e1013;
      }

      :where(html[data-theme='light']) {
        background: #fbfcfd;
      }
    </style>

    <script>
      try {
        var chosen = localStorage.getItem('nib:theme-scheme') || 'system'
        var side =
          chosen === 'dark' || chosen === 'light'
            ? chosen
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = side

        var ground = localStorage.getItem('nib:ground')
        if (ground) document.documentElement.style.background = ground
      } catch (whatever) {
        // A window told to keep no site data refuses the getter. Nothing to put right:
        // the colours above are the app's own, and the reader sees the default palette
        // for a fifth of a second rather than white.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/quick-add.ts"></script>
  </body>
</html>
