# nib on its own Chromium, built, packed and measured on the two desktops that offer it.
#
# The Browser setting switches nib between the system's engine and its own Chromium
# (src/engine_switch.rs), and the Chromium half is a second build of the same source
# against Tauri 3 and `tauri-runtime-cef` (apps/desktop/src-tauri/cef). release.yml
# builds and publishes it with every release; this is its proof on a branch, before a
# release depends on it: the build, its tests, the two archives the release would carry,
# and the gate - both builds started, and what each costs.
#
# Gated the same way spike-cef.yml is, and for the same reason: this downloads three
# hundred megabytes of Chromium and builds it into a browser, which has no business on
# the path of an ordinary contribution. A branch named `ci-check-cef*`, or somebody
# asking by hand.
#
# Windows and a Mac. Not Linux, where the engine's toolkit and the app's cannot share a
# process (docs/browser.md section 10) and the setting has no row.
name: cef

on:
  push:
    branches: [ci-check-cef, 'ci-check-cef-**']
  workflow_dispatch:
    inputs:
      tabs:
        description: 'How many web tabs the gate opens'
        type: string
        default: '2'

concurrency:
  group: cef-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    strategy:
      # Not fail fast: what Windows does and what a Mac does are two answers.
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x86_64
          - runner: macos-latest
            platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      # Chromium's own fatal messages, on stderr where the gate reads them.
      NIB_CEF_ARGS: enable-logging=stderr
      CEF_DIR: ${{ github.workspace }}/.cef
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: What the loader is read with
        if: runner.os == 'Windows'
        run: python -m pip install --quiet pefile

      # Tauri's build script embeds the built frontend, so it has to exist before either
      # build will compile.
      - name: The frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nib/desktop build

      # The engine's dependency list is the app's, written by a script; a stale one is
      # a build of something other than the app. apps/desktop/test/cef.test.ts says the
      # same in check.yml.
      - name: The manifest is the app's
        run: |
          node scripts/engine-manifest.ts
          git diff --exit-code apps/desktop/src-tauri/cef/Cargo.toml

      # The app as it ships, which the gate reads every number against.
      - name: The app as it ships
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --release

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/src-tauri/cef/Cargo.toml') }}

      - name: The engine
        run: bash apps/desktop/src-tauri/cef/engine.sh "$(rustc -vV | sed -n 's/^host: //p')"

      # No run of a built app ever touches a real space, on any runner.
      - name: Where a run's spaces go
        run: echo "NIB_SPACES_DIR=${{ runner.temp }}/nib-spaces" >>"$GITHUB_ENV"

      - name: Format
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo fmt --manifest-path apps/desktop/src-tauri/cef/Cargo.toml --check

      # From inside the folder, because the engine's Windows libraries want the static
      # C runtime and the Cargo config that asks for it is only read from the folder a
      # build runs in upwards; see apps/desktop/src-tauri/cef/.cargo/config.toml.
      - name: The engine build
        working-directory: apps/desktop/src-tauri/cef
        run: cargo build --release --locked

      # The library's code under the other engine, held to the same pedantic floor as
      # check.yml holds it to under the system's.
      - name: Clippy on the engine build
        working-directory: apps/desktop/src-tauri/cef
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - name: Its tests
        working-directory: apps/desktop/src-tauri/cef
        run: cargo test --release --locked

      # The two archives release.yml publishes, made the same way, so a release never
      # finds out first that a platform does not pack.
      - name: Pack
        run: |
          suffix=''
          [ "${{ runner.os }}" = "Windows" ] && suffix='.exe'
          python apps/desktop/src-tauri/cef/pack.py \
            --binary "apps/desktop/src-tauri/cef/target/release/nib-chromium$suffix" \
            --engine "$CEF_PATH" \
            --version 0.0.0 \
            --platform "${{ matrix.platform }}" \
            --out chromium-out
          ls -l chromium-out

      # The gate exits 0 whenever it wrote its table, with the verdict in the table, so
      # this step being red means the gate could not run at all.
      - name: Run the gate
        env:
          NIB_CEF_TABS: ${{ inputs.tabs || '2' }}
          NIB_CEF_SANDBOX: disabled
        run: |
          suffix=''
          [ "${{ runner.os }}" = "Windows" ] && suffix='.exe'
          python apps/desktop/src-tauri/cef/gate.py \
            --cef "apps/desktop/src-tauri/cef/target/release/nib-chromium$suffix" \
            --control "apps/desktop/src-tauri/target/release/nib$suffix" \
            --engine "$CEF_PATH" \
            --extension spike/browser/extension \
            --tabs "$NIB_CEF_TABS" \
            --out gate-out

      - name: The gate table
        if: always()
        run: |
          {
            echo "## ${{ matrix.platform }}"
            echo
            cat chromium-out/chromium-*.json 2>/dev/null || true
            echo
            cat gate-out/gate.md 2>/dev/null || echo 'the gate wrote no table'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cef-${{ matrix.platform }}
          path: |
            gate-out/**
            chromium-out/*.json
          if-no-files-found: warn
          retention-days: 7
