name: mac-hunt

on:
  pull_request:

permissions:
  contents: read

jobs:
  drives:
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The browser
        run: |
          python3 -m pip install --quiet --break-system-packages playwright
          python3 -m playwright install webkit
      - name: Drives in WebKit
        env:
          NIB_ENGINE: webkit
        run: python3 apps/desktop/test/e2e/run-all.py --jobs 3 --retries 1
      - name: The table
        if: always()
        run: |
          table=apps/desktop/test/e2e/shots/results.md
          if [ -f "$table" ]; then cat "$table" >>"$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-drives
          path: apps/desktop/test/e2e/shots
          retention-days: 7
          if-no-files-found: ignore
