name: publish

# Where Orden goes once it is released: the package managers that carry it. One
# job per manager, none depending on another, so a rate-limited push or a
# rejected pull request never holds up the rest.
#
# Only published stable releases are sent to package managers. The rolling
# `edge` prerelease is built from `unstable` and is deliberately not published
# through this release channel.
#
# Started by release.yml's publish job, once the release and every file on it are up:
# a dispatch, because a release that job makes on its own token raises no event any
# other workflow hears. Nothing listens for `release: published` either. A release made
# by hand would raise it before its installers were uploaded, and the run after the
# dispatch would publish it a second time. A release can be sent through again by hand,
# `gh workflow run publish.yml -f tag=v0.15.0`, and every job is safe to run twice: the
# bucket and the tap commit only what changed, and Chocolatey skips a version it has.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, for example v0.4.0
        required: true

# Two releases published minutes apart would race for the same branch of the
# bucket and the tap, so they queue instead.
concurrency:
  group: publish
  cancel-in-progress: false

# The floor, so a job added below without a block of its own still only reads.
# Every job states its own as well, because what a job may do is part of what the
# job is.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # It checks nothing out and calls nothing: two secrets read as booleans and a
    # tag picked apart. Nothing for a token to do, so it is handed none.
    permissions: {}
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      winget: ${{ steps.tokens.outputs.winget }}
      packaging: ${{ steps.tokens.outputs.packaging }}
      chocolatey: ${{ steps.tokens.outputs.chocolatey }}
    steps:
      - id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == v*.*.* && "$TAG" != *-* ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is not a released version tag - nothing to publish."
          fi

      # A job cannot ask `if: secrets.X != ''`, so which tokens are configured
      # is settled here and passed down as plain booleans. A manager whose
      # token is missing is skipped rather than failed: the point of this file
      # is that a release with no secrets at all still publishes fine.
      - id: tokens
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          {
            echo "winget=$([[ -n $WINGET_TOKEN ]] && echo true || echo false)"
            echo "packaging=$([[ -n $PACKAGING_TOKEN ]] && echo true || echo false)"
            echo "chocolatey=$([[ -n $CHOCOLATEY_API_KEY ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  # winget-pkgs is a pull request, not a push, so this opens one and a Microsoft
  # bot merges it. The action needs the package to exist there already - it
  # refuses to create a package from nothing - so its first version is submitted
  # by hand. lxorb.Nib never got past its pull request and nobody installed it,
  # so the package starts out under the product's name instead: lxorb.Orden.
  winget:
    needs: gate
    if: needs.gate.outputs.publish == 'true' && needs.gate.outputs.winget == 'true'
    runs-on: ubuntu-latest
    # The pull request against winget-pkgs is opened with the PAT below. This
    # token only reads: the action asks this repository for the release's assets
    # with it, and fetches komac with it.
    permissions:
      contents: read
    steps:
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: lxorb.Orden
          version: ${{ needs.gate.outputs.version }}
          release-tag: ${{ needs.gate.outputs.tag }}
          # The NSIS setup is the installer winget offers. The MSI is a
          # per-machine install of the same thing and would only be a second
          # entry saying the same.
          installers-regex: '-setup\.exe$'
          fork-user: lxorb
          max-versions-to-keep: 5
          # A classic PAT with `public_repo`; the action cannot use a
          # fine-grained one.
          token: ${{ secrets.WINGET_TOKEN }}

  # lxorb/apt, the apt repository: its `stable` suite, written by apt.yml, which
  # release.yml calls as well for `unstable`. A workflow of its own, so the two never
  # push the repository at once; it skips itself where the key or the token is missing.
  apt:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/apt.yml
    with:
      suite: stable
      tag: ${{ needs.gate.outputs.tag }}
    secrets: inherit

  # lxorb/scoop-bucket is ours, so this is a commit rather than a pull request.
  scoop:
    needs: gate
    if: needs.gate.outputs.publish == 'true' && needs.gate.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    # The commit goes to lxorb/scoop-bucket on the PACKAGING_TOKEN. This token
    # only downloads this release's own installers.
    permissions:
      contents: read
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: lxorb/scoop-bucket
          token: ${{ secrets.PACKAGING_TOKEN }}

      # The manifest as this release has it, rather than as the bucket last had it,
      # the same way the cask below is taken: a line other than the version, the
      # urls and the digests can change with a release, the way the product's name
      # did.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}
          path: source
          sparse-checkout: packaging/scoop
          persist-credentials: false

      # A release from before the rename has no orden.json; this run's own is the
      # manifest then. Its version, urls and digests are written below either way.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: current
          sparse-checkout: packaging/scoop
          persist-credentials: false

      - name: Bump orden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest=source/packaging/scoop/orden.json
          [ -f "$manifest" ] || manifest=current/packaging/scoop/orden.json
          cp "$manifest" bucket/orden.json
          rm -r source current

          # The app was nib in this bucket up to 0.15.0. Scoop has no rename; what it has
          # is `bucket/deprecated/`: a manifest there still updates what it installed,
          # and `scoop status` says Deprecated beside it. So nib's goes there, once, saying
          # where Orden is now, and is not touched again.
          if [ -f bucket/nib.json ]; then
            mkdir -p bucket/deprecated
            git mv bucket/nib.json bucket/deprecated/nib.json
            jq --indent 4 '.notes = ["Renamed: Orden is the orden package now. scoop uninstall nib, then scoop install orden; what nib kept in its persist folder comes over."] + ([.notes] | flatten | map(select(. != null)))' \
              bucket/deprecated/nib.json > bucket/deprecated/nib.json.next
            mv bucket/deprecated/nib.json.next bucket/deprecated/nib.json
          fi

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl \
            --pattern "Orden-$VERSION-windows-x64-setup.exe" \
            --pattern "Orden-$VERSION-windows-arm64-setup.exe"

          base="${{ github.server_url }}/$GITHUB_REPOSITORY/releases/download/$TAG"
          # Scoop reads the extension to pick an extractor, and an NSIS setup
          # is a 7-Zip archive as far as that goes; the fragment renames the
          # download so it is unpacked instead of run.
          jq --indent 4 \
            --arg version "$VERSION" \
            --arg x64url "$base/Orden-$VERSION-windows-x64-setup.exe#/dl.7z" \
            --arg x64hash "$(sha256sum "dl/Orden-$VERSION-windows-x64-setup.exe" | cut -d' ' -f1)" \
            --arg armurl "$base/Orden-$VERSION-windows-arm64-setup.exe#/dl.7z" \
            --arg armhash "$(sha256sum "dl/Orden-$VERSION-windows-arm64-setup.exe" | cut -d' ' -f1)" \
            '.version = $version
             | .architecture["64bit"].url = $x64url
             | .architecture["64bit"].hash = $x64hash
             | .architecture.arm64.url = $armurl
             | .architecture.arm64.hash = $armhash' \
            bucket/orden.json > bucket/orden.json.next
          mv bucket/orden.json.next bucket/orden.json
          rm -r dl

      - name: Commit
        run: |
          git config user.name lxorb
          git config user.email 101118850+lxorb@users.noreply.github.com
          git add -A bucket
          git diff --quiet --cached || git commit -m "feat: orden $VERSION"
          git push

  # lxorb/homebrew-tap, likewise ours. Homebrew/homebrew-cask is not: it has a
  # notability bar Orden has not cleared, so there is nothing to send there yet.
  homebrew:
    needs: gate
    if: needs.gate.outputs.publish == 'true' && needs.gate.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    # Likewise: the tap is pushed to on the PACKAGING_TOKEN, and this token only
    # downloads the dmg to hash it.
    permissions:
      contents: read
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: lxorb/homebrew-tap
          token: ${{ secrets.PACKAGING_TOKEN }}

      # The cask as this release has it, rather than as the tap last had it: a line
      # other than the version and the digest can change with a release, the way the
      # app's folder was renamed to nibeditor.app and then to Orden.app.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}
          path: source
          sparse-checkout: packaging/homebrew
          persist-credentials: false

      - name: Bump orden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp source/packaging/homebrew/orden.rb Casks/orden.rb
          rm -r source

          # The cask was called nib until the product was. `cask_renames.json` is how
          # a tap renames one: `brew upgrade` moves everybody who has nib over to
          # orden, and `brew install lxorb/tap/nib` still finds it. The old file has
          # to go for that, and both steps change nothing once they have happened.
          git rm -q --ignore-unmatch Casks/nib.rb
          renames=$(cat cask_renames.json 2>/dev/null || echo '{}')
          jq --indent 2 '. + {"nib": "orden"}' <<<"$renames" > cask_renames.json

          dmg="Orden-$VERSION-macos-universal.dmg"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl --pattern "$dmg"
          sha=$(sha256sum "dl/$dmg" | cut -d' ' -f1)
          rm -r dl

          # The cask builds its own URL out of the version, so only these two
          # lines change on the way.
          sed -i -E "s|^(  version )\".*\"$|\\1\"$VERSION\"|" Casks/orden.rb
          sed -i -E "s|^(  sha256 )\".*\"$|\\1\"$sha\"|" Casks/orden.rb
          grep -E '^  (version|sha256) ' Casks/orden.rb

      - name: Commit
        run: |
          git config user.name lxorb
          git config user.email 101118850+lxorb@users.noreply.github.com
          git add Casks/orden.rb cask_renames.json
          git diff --quiet --cached || git commit -m "feat: orden $VERSION"
          git push

  # Chocolatey is a push of a built package, and the only one of the four that
  # needs Windows, because `choco` is what builds it. Two packages: `orden`, the app,
  # and `nib`, its name up to 0.15.0, which is now empty and depends on `orden` - the
  # way Chocolatey deprecates a package (packaging/chocolatey/nib.nuspec). A version the
  # community repository has already is a 409, which is a package already published
  # rather than a failure: a run again after a partial one finishes the rest.
  chocolatey:
    needs: gate
    if: needs.gate.outputs.publish == 'true' && needs.gate.outputs.chocolatey == 'true'
    runs-on: windows-latest
    # The package is pushed to the community repository on its own API key; this
    # token only downloads the two MSIs to hash them.
    permissions:
      contents: read
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Chocolatey installs for the whole machine, so this package carries the
      # MSI rather than the per-user NSIS setup. The install script spells every
      # url and checksum out as a literal so the community repository's validator
      # can read them, so the version in both urls and both digests are rewritten.
      - name: Bump orden and nib
        shell: bash
        working-directory: packaging/chocolatey
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl \
            --pattern "Orden-$VERSION-windows-x64.msi" \
            --pattern "Orden-$VERSION-windows-arm64.msi"

          sed -i -E "s|(releases/download/v)[^/']+/[A-Za-z]+-[^']+-windows-|\\1$VERSION/Orden-$VERSION-windows-|" tools/chocolateyinstall.ps1

          # A digest is the first one below the url it belongs to, so the
          # architecture in that url is what picks which of the two is rewritten.
          for arch in x64 arm64; do
            sum=$(sha256sum "dl/Orden-$VERSION-windows-$arch.msi" | cut -d' ' -f1 | tr 'a-f' 'A-F')
            sed -i -E "/-windows-$arch\.msi'/,/'[0-9A-Fa-f]{64}'/ s|'[0-9A-Fa-f]{64}'|'$sum'|" tools/chocolateyinstall.ps1
          done
          rm -r dl

          sed -i -E "s|<version>.*</version>|<version>$VERSION</version>|" orden.nuspec
          sed -i -E "s|(orden@v)[0-9][^/]*|\\1$VERSION|" orden.nuspec
          sed -i -E "s|(releases/tag/v)[0-9].*<|\\1$VERSION<|" orden.nuspec

          # nib's version is the release's and the day it was published, so it is newer
          # than every nib before it and the same on every run for one release.
          day=$(date -u -d "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)" +%Y%m%d)
          sed -i -E "s|<version>.*</version>|<version>$VERSION.$day</version>|" nib.nuspec
          sed -i -E "s|(<dependency id=\"orden\" version=\")[^\"]*\"|\\1$VERSION\"|" nib.nuspec
          echo "NIB_VERSION=$VERSION.$day" >> "$GITHUB_ENV"

          grep -E "releases/download|'[0-9A-Fa-f]{64}'" tools/chocolateyinstall.ps1
          grep -E '<version>|orden@v|releases/tag' orden.nuspec
          grep -E '<version>|<dependency ' nib.nuspec

      - name: Pack and push
        shell: pwsh
        working-directory: packaging/chocolatey
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          # `orden` first, so the package `nib` depends on is there when `nib` is read.
          foreach ($package in @(@{ id = 'orden'; version = $env:VERSION }, @{ id = 'nib'; version = $env:NIB_VERSION })) {
            choco pack "$($package.id).nuspec"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $said = choco push "$($package.id).$($package.version).nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY 2>&1 | Out-String
            Write-Output $said
            if ($LASTEXITCODE -eq 0) {
              "- ``$($package.id)`` $($package.version): pushed" >> $env:GITHUB_STEP_SUMMARY
            } elseif ($said -match '409 \(Conflict\)') {
              "- ``$($package.id)`` $($package.version): already on the community repository, skipped" >> $env:GITHUB_STEP_SUMMARY
            } else {
              exit $LASTEXITCODE
            }
          }
