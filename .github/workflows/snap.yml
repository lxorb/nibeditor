name: snap

# The snap, built from a release's .debs and uploaded to the Snap Store: a stable release
# to the `stable` channel, from publish-linux.yml, and the edge build to `edge`, from
# release.yml once edge's files are up. Both call this workflow (`uses:`) rather than
# dispatching it, because a dispatch only finds a workflow that is on the default branch
# already. By hand, once it is on main:
#
#   gh workflow run snap.yml -f tag=v0.15.0
#   gh workflow run snap.yml -f tag=edge
#
# The snap is built either way and kept as an artifact; it is uploaded only where
# SNAPCRAFT_STORE_CREDENTIALS is set. See packaging/linux.md, "Snap Store".
on:
  workflow_call:
    inputs:
      tag:
        description: The release whose .debs go in, v1.2.3 for stable and edge for edge
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release whose .debs go in, v1.2.3 for stable and edge for edge
        required: true

permissions:
  contents: read

jobs:
  snap:
    name: Snap Store (${{ matrix.arch }})
    # It reads the repository and uploads an artifact, which travels on the
    # runtime's own token rather than on this one. The upload to the Snap Store
    # goes on SNAPCRAFT_STORE_CREDENTIALS.
    permissions:
      contents: read
    # One snap per architecture, each built on a runner of that architecture:
    # snapcraft cross-builds nothing here, it only unpacks the matching .deb.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ inputs.tag }}
      ARCH: ${{ matrix.arch }}
      HAS_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # A release goes to `stable` and edge to `edge`, and nothing else goes anywhere. The
      # edge build is `grade: devel`, which the store keeps out of `stable` and
      # `candidate` whatever a later step asks.
      - name: Which channel
        id: channel
        run: |
          if [[ $TAG == edge ]]; then
            echo 'channel=edge' >>"$GITHUB_OUTPUT"
            echo 'grade=devel' >>"$GITHUB_OUTPUT"
          elif [[ $TAG == v*.*.* && $TAG != *-* ]]; then
            echo 'channel=stable' >>"$GITHUB_OUTPUT"
            echo 'grade=stable' >>"$GITHUB_OUTPUT"
          else
            echo "::error::$TAG is neither a released v*.*.* nor edge"
            exit 1
          fi

      - name: Point snapcraft.yaml at this release
        working-directory: packaging/snap
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GRADE: ${{ steps.channel.outputs.grade }}
        run: |
          assets=$(gh release view "$TAG" --repo "$REPO" --json assets)

          # The two .debs, found by what they are rather than by a name built here: a
          # release's page calls them Orden-<version>, edge Nib-<version>, and the version
          # of an edge build is in nothing but its files' names.
          name() { jq -r --arg end "-linux-$1.deb" '[.assets[] | select(.name | endswith($end)) | .name] | if length == 1 then .[0] else empty end' <<<"$assets"; }
          x64deb=$(name x64)
          arm64deb=$(name arm64)
          if [ -z "$x64deb" ] || [ -z "$arm64deb" ]; then
            echo "::error::$TAG does not carry one linux .deb for each architecture"
            exit 1
          fi
          version=$(sed -E 's/^[A-Za-z]+-(.+)-linux-x64\.deb$/\1/' <<<"$x64deb")

          # A snap's version is at most 32 of letters, digits and `.+~-`, beginning and
          # ending with a letter or a digit: 0.15.0 and 0.15.1-688 both are.
          if ! [[ $version =~ ^[A-Za-z0-9]([A-Za-z0-9.+~-]{0,30}[A-Za-z0-9])?$ ]]; then
            echo "::error::$version is not a version the Snap Store takes"
            exit 1
          fi

          # The digests the release page reports for the two files this unpacks, read
          # rather than computed: the bytes are snapcraft's to fetch, and what is
          # wanted here is what the release says they are. A missing one fails the
          # step - a snap built with no digest is a snap nobody checked.
          digest() { jq -r --arg name "$1" '.assets[] | select(.name == $name) | .digest // empty' <<<"$assets" | sed 's|^sha256:||'; }
          amd64=$(digest "$x64deb")
          arm64=$(digest "$arm64deb")
          for said in "$amd64" "$arm64"; do
            if [ -z "$said" ]; then
              echo "::error::the release page reports no sha256 for a linux .deb of $version"
              exit 1
            fi
          done

          # Both digests into the record, and this runner's into the one line snapcraft reads.
          if [ "$ARCH" = arm64 ]; then own=$arm64; else own=$amd64; fi
          base="https://github.com/$REPO/releases/download/$TAG"
          sed -i -E \
            -e "s/^version: .*/version: '$version'/" \
            -e "s/^grade: .*/grade: $GRADE/" \
            -e "s|^( *- on amd64: )https://.*\.deb$|\1$base/$x64deb|" \
            -e "s|^( *- on arm64: )https://.*\.deb$|\1$base/$arm64deb|" \
            -e "s|on amd64: sha256/.*|on amd64: sha256/$amd64|" \
            -e "s|on arm64: sha256/.*|on arm64: sha256/$arm64|" \
            -e "s|^( *source-checksum: sha256/).*|\1$own|" \
            snapcraft.yaml
          grep -nE "^version:|^grade:|releases/download|sha256/" snapcraft.yaml

      # Pinned for the same reason: `v1` is a moving name, and the second of the
      # two is handed the Snap Store's credentials.
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build
        with:
          path: packaging/snap

      - uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        if: env.HAS_CREDENTIALS == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ steps.channel.outputs.channel }}

      - name: No Snapcraft credentials yet
        if: env.HAS_CREDENTIALS != 'true'
        run: |
          {
            echo "### Snap not published"
            echo "The snap builds, but SNAPCRAFT_STORE_CREDENTIALS is not set, so nothing was uploaded."
            echo "See packaging/linux.md for how to register the name and add the secret."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: snap-${{ steps.channel.outputs.channel }}-${{ matrix.arch }}
          path: packaging/snap/*.snap
          if-no-files-found: warn
