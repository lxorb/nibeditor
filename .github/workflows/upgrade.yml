name: upgrade

# An install of the last release made under the old product name, Nib (0.11.0),
# updated by this build, on runners that are nobody's machine: every road to an
# update on Windows (nib's own updater, winget, a folder of its own, the MSI that
# Chocolatey runs) and the Mac's first launch after the updater put this build into
# Nib.app. What each checks is in scripts/windows-upgrade.ps1 and below.
#
# Not on every push: each road is a real install, and the build alone is the
# better part of half an hour. On a pull request that touches what an update does,
# and by hand.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop/src-tauri/installer.nsh
      - apps/desktop/src-tauri/wix/**
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/tauri.macos.conf.json
      - apps/desktop/src-tauri/src/bundle_name.rs
      - apps/desktop/src-tauri/src/default_browser.rs
      - scripts/windows-upgrade.ps1
      - .github/workflows/upgrade.yml

concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The release the old name last shipped as, and a number above it for this build.
  OLD: '0.11.0'
  NEW: '0.12.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis,msi
            label: windows
          - platform: macos-latest
            bundles: app
            label: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            apps/desktop/src-tauri
          key: upgrade-${{ matrix.label }}
      - run: pnpm install --frozen-lockfile

      # Unsigned for the updater: nothing here is served to one.
      - name: Build
        shell: bash
        run: |
          pnpm --filter @nib/desktop exec tauri build --bundles ${{ matrix.bundles }} \
            --config "{\"version\":\"$NEW\",\"bundle\":{\"createUpdaterArtifacts\":false}}"

      # An artifact keeps no file modes, and a Mac app's program has to stay one.
      - name: Pack the app
        if: runner.os == 'macOS'
        working-directory: apps/desktop/src-tauri/target/release/bundle/macos
        run: tar -czf app.tgz *.app

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: new-${{ matrix.label }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/macos/app.tgz

  windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        scenario: [updater, silent, elsewhere, msi]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: new-windows
          path: new

      # The old release's own files, and the script that seals a default browser the
      # way Settings does, pinned by its digest.
      - name: The old release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$OLD" --repo "$GITHUB_REPOSITORY" --dir old \
            --pattern "Nib-$OLD-windows-x64-setup.exe" --pattern "Nib-$OLD-windows-x64.msi"
          curl -fsSL -o SFTA.ps1 \
            https://raw.githubusercontent.com/DanysysTeam/PS-SFTA/22a32292e576afc976a1167d92b50741ef523066/SFTA.ps1
          echo '3eb6f6dee3fd8c91604042060b9d658f08ec85d3fd0a14769119dfd78bc30851  SFTA.ps1' | sha256sum -c
          find new old -type f

      - name: ${{ matrix.scenario }}
        shell: pwsh
        run: |
          $setup = Get-ChildItem new -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          $msi = Get-ChildItem new -Recurse -Filter '*.msi' | Select-Object -First 1
          New-Item -ItemType Directory -Force flat | Out-Null
          Copy-Item $setup.FullName, $msi.FullName flat
          ./scripts/windows-upgrade.ps1 -Scenario ${{ matrix.scenario }} -Old old -New flat -Sfta ./SFTA.ps1

  # The Mac: the old app in a folder of its own, this build put into it the way
  # Tauri's updater does (the archive's contents in place of the old ones, the
  # folder's name kept), and launched. It renames itself and starts again from
  # nibeditor.app; a copy Homebrew put there keeps its name.
  macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: new-macos
          path: new

      - name: The old release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$OLD" --repo "$GITHUB_REPOSITORY" --dir old \
            --pattern "Nib-$OLD-macos-universal.dmg"
          hdiutil attach -nobrowse -mountpoint /tmp/old old/*.dmg
          tar -xzf new/app.tgz -C new
          ls /tmp/old new

      - name: Updated in place, then launched
        run: |
          set -u
          apps="$HOME/Applications"
          mkdir -p "$apps"
          ditto /tmp/old/Nib.app "$apps/Nib.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$apps/Nib.app/Contents/Info.plist"

          # What the updater does: the new bundle's contents under the old name.
          rm -rf "$apps/Nib.app"
          ditto new/nibeditor.app "$apps/Nib.app"
          open "$apps/Nib.app"

          for _ in $(seq 60); do
            pgrep -fl "$apps/nibeditor.app/Contents/MacOS/" && break
            sleep 1
          done
          ls "$apps"
          test -d "$apps/nibeditor.app" || { echo 'nibeditor.app is not there'; exit 1; }
          test ! -e "$apps/Nib.app" || { echo 'Nib.app is still there'; exit 1; }
          pgrep -fl "$apps/nibeditor.app/Contents/MacOS/" || { echo 'it did not start again from nibeditor.app'; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$apps/nibeditor.app/Contents/Info.plist")" = nibeditor
          osascript -e 'quit app id "ch.emilvinu.nib"' || true
          sleep 3
          pkill -f "$apps/nibeditor.app/Contents/MacOS/" || true

      - name: A copy Homebrew put there keeps its name
        run: |
          set -u
          apps="$HOME/Applications"
          rm -rf "$apps/nibeditor.app"
          ditto new/nibeditor.app "$apps/Nib.app"
          room="$(brew --prefix)/Caskroom/nib"
          mkdir -p "$room"
          open "$apps/Nib.app"

          for _ in $(seq 30); do
            pgrep -fl "$apps/Nib.app/Contents/MacOS/" && break
            sleep 1
          done
          sleep 5
          ls "$apps"
          test -d "$apps/Nib.app" || { echo 'Nib.app was renamed under Homebrew'; exit 1; }
          test ! -e "$apps/nibeditor.app" || { echo 'nibeditor.app appeared under Homebrew'; exit 1; }
          pgrep -fl "$apps/Nib.app/Contents/MacOS/" || { echo 'it is not running from Nib.app'; exit 1; }
          osascript -e 'quit app id "ch.emilvinu.nib"' || true
          rmdir "$room"
