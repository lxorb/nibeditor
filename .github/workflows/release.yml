name: release

# Two kinds of release come out of here. A tag `v*` is a release proper, with
# its own page and its own number. Every push to main is a build as well: the
# desktop app follows main the way orden.so does, so what is on main is
# what people run, not only what was last tagged. Those builds land on one
# rolling pre-release tagged `edge`, replaced each time - not `main`, since a
# tag sharing a name with the branch makes every `git checkout main` ambiguous.
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

# A build of main is never cancelled by a newer push: pushes came faster than a
# build takes, so none ever finished and edge stood still. The running one
# finishes, and only the newest push waits behind it. A tag is a release of its
# own and is never cancelled; a dispatch on another branch is a trial, and the
# newer one replaces it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# The floor, so a job added below without a block of its own still only reads.
# Every job states its own as well, because what a job may do is part of what the
# job is.
permissions:
  contents: read

jobs:
  # What this build is called; see scripts/build-version.sh.
  version:
    runs-on: ubuntu-latest
    # All but one of the jobs below may only read; the one that writes says so.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      rolling: ${{ steps.decide.outputs.rolling }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The whole history, so the newest tag can be found from main.
          fetch-depth: 0

      - id: decide
        shell: bash
        run: bash scripts/build-version.sh edge

  build:
    needs: version
    # It reads the repository and uploads an artifact, which travels on the
    # runtime's own token rather than on this one.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
          # One download that runs on every Mac, Intel or Apple silicon, which
          # needs both architectures installed to lipo together.
          - platform: macos-latest
            target: universal-apple-darwin
            label: macos-universal
            rust: aarch64-apple-darwin,x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # No version here: it comes from the root package.json's packageManager.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # Not on Linux arm, the one store no other job shares: the repository's
          # cache holds 10 GB, and half a gigabyte saved for a job with time to
          # spare pushed out a Rust cache a slower job needed.
          cache: ${{ matrix.platform != 'ubuntu-22.04-arm' && 'pnpm' || '' }}
          package-manager-cache: ${{ matrix.platform != 'ubuntu-22.04-arm' }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the stable branch
        with:
          # Named, and not left to the `@stable` the ref used to carry: with the
          # action pinned to a commit, the ref no longer says which toolchain to
          # install, and this is the input that does.
          toolchain: stable
          # Universal is a Tauri target, not a rustup one, so that row names the
          # real targets itself. Everything else builds for what it runs on.
          targets: ${{ matrix.rust || matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            apps/desktop/src-tauri
          key: ${{ matrix.target }}

      # xdg-utils is what the AppImage bundler copies `xdg-open` from; the x64
      # image happens to ship it, the arm image does not.
      - name: System dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils

      - run: pnpm install --frozen-lockfile

      # A Developer ID and notarization, once the secrets exist. Without them the
      # bundle keeps the ad-hoc signature tauri.conf.json asks for, which Apple
      # silicon needs to run it at all. Exported only when set: the bundler reads
      # an empty APPLE_SIGNING_IDENTITY as an identity named "".
      - name: Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || exit 0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -n "$value" ] || continue
            echo "::add-mask::$value"
            { echo "$name<<__nib_eof__"; echo "$value"; echo "__nib_eof__"; } >> "$GITHUB_ENV"
          done

      # Signed so the updater will accept them. Without the key the build still
      # succeeds; it just produces bundles that cannot be auto-installed.
      #
      # The version is passed in rather than read from tauri.conf.json, so a
      # build of main carries the number the manifest will claim for it.
      - name: Build the app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          pnpm --filter @nib/desktop exec tauri build --target ${{ matrix.target }} \
            --config '{"version":"${{ needs.version.outputs.version }}"}'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nib-${{ matrix.label }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

  # nib's own Chromium, for the Browser setting to fetch: the same app built again on
  # the engine, packed as the engine's own files and the app built on them, and signed
  # with the updater's key like an installer. Never inside an installer - most people
  # never switch, and it is four hundred megabytes - and never in the way of one: a
  # platform whose engine does not build is a release without Chromium on that
  # platform, and the installers go out regardless. See docs/browser.md and
  # apps/desktop/src-tauri/cef.
  #
  # Windows and a Mac. Not Linux, where the engine's toolkit and the app's cannot share
  # a process (docs/browser.md section 10), so the setting has no row there.
  chromium:
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-aarch64
          - runner: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
          - runner: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CEF_DIR: ${{ github.workspace }}/.cef
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # The engine's C++ wrapper is compiled by MSVC, which cannot write an object whose
      # path is over 260 characters ("C1083: Cannot open compiler generated file: ''").
      # Under the checkout, a build for a named target is that long: cef.yml builds for
      # the host and fits, this names the triple and did not. So Windows builds in a
      # short folder beside the checkout, set before the cache below so the cache is of
      # that folder: a cache of the checkout's own target restored a folder nothing
      # built into, and every crate was compiled again on every run.
      - name: A short build folder on Windows
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_DIR=$(cd "$GITHUB_WORKSPACE/.." && pwd -W)/t" >>"$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Relative to the folder before it: five levels up is the one holding the
          # checkout, where the step above puts Windows' build.
          workspaces: |
            apps/desktop/src-tauri/cef -> ${{ runner.os == 'Windows' && '../../../../../t' || 'target' }}
          key: chromium-${{ matrix.target }}

      # The interface the engine build embeds, as the installers do, and with the number
      # they carry: the Tauri CLI hands `--config` to the frontend build as TAURI_CONFIG,
      # and this build has no CLI to do it (apps/desktop/vite.config.ts, `appVersion`).
      - name: The frontend
        env:
          TAURI_CONFIG: '{"version":"${{ needs.version.outputs.version }}"}'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nib/desktop build

      - name: The engine
        run: bash apps/desktop/src-tauri/cef/engine.sh "${{ matrix.target }}"

      - name: Build the app on it
        working-directory: apps/desktop/src-tauri/cef
        env:
          TAURI_CONFIG: '{"version":"${{ needs.version.outputs.version }}"}'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Pack
        run: |
          suffix=''
          [ "${{ runner.os }}" = "Windows" ] && suffix='.exe'
          python apps/desktop/src-tauri/cef/pack.py \
            --binary "${CARGO_TARGET_DIR:-apps/desktop/src-tauri/cef/target}/${{ matrix.target }}/release/nib-chromium$suffix" \
            --engine "$CEF_PATH" \
            --version "${{ needs.version.outputs.version }}" \
            --platform "${{ matrix.platform }}" \
            --out chromium-out

      # With the updater's own key, which is what the app checks every archive against
      # before it unpacks a byte. Without the key there is nothing the app would accept,
      # so nothing is uploaded either.
      - name: Sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "no signing key: this platform's Chromium is not published"; exit 1; }
          for archive in chromium-out/*.tar.gz; do
            pnpm --filter @nib/desktop exec tauri signer sign -p '' "$PWD/$archive"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chromium-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            chromium-out/*.tar.gz
            chromium-out/*.sig
            chromium-out/*.json

  # One manifest for every platform, which is what the app polls.
  #
  # A release's own page is for people: the installers, under the product's name, and
  # latest.json, which every install asks for at releases/latest/download. What the app
  # downloads by itself goes on one pre-release, `updates`, beside every other version's:
  # the bundles the updater installs, and nib's own Chromium (fetch.rs, `release`). The
  # bundles there keep the name `Nib-`, because every build before 0.14 takes an update
  # only from a file called that (`names()` in src-tauri/src/updates.rs), and the one
  # manifest serves them all. A build of main keeps everything on `edge`, as it always has.
  publish:
    needs: [version, build, chromium]
    # The installers are the release; Chromium goes with them where it built, and a
    # platform whose engine failed is a release without it rather than no release.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # The one job that writes: the release and its files are the point of it.
    permissions:
      contents: write
      # To dispatch publish.yml, publish-linux.yml and packaging-bump.yml at the end
      # of this job.
      actions: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      ROLLING: ${{ needs.version.outputs.rolling }}
      # Where the files the app downloads by itself go.
      FILES: ${{ needs.version.outputs.rolling == 'true' && needs.version.outputs.tag || 'updates' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: artifacts }

      # Before the manifest, which builds its download URLs from the filenames.
      - name: Name the downloads for humans
        run: node scripts/name-assets.mjs artifacts "$VERSION"

      - name: Build latest.json
        run: node scripts/update-manifest.mjs "$FILES" "$VERSION" artifacts > latest.json

      # The rolling release is remade rather than added to: an old build's
      # files under a new manifest would be the worst of both.
      - name: Replace the build of main
        if: needs.version.outputs.rolling == 'true'
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "main · $VERSION" \
            --notes ""

      - name: Publish the release
        if: needs.version.outputs.rolling != 'true'
        run: gh release create "$TAG" --title "$TAG" --notes "" || true

      # Made by the first release that needs it, and a pre-release, so it is never the
      # latest one.
      - name: The release the app downloads from
        if: needs.version.outputs.rolling != 'true'
        run: |
          gh release view "$FILES" >/dev/null 2>&1 ||
            gh release create "$FILES" --prerelease --target "$GITHUB_SHA" --title "$FILES" --notes ""

      # A runtime is the same engine whichever version packed it, and `updates` keeps the
      # first one: replacing it would leave every earlier version's manifest naming a
      # signature its file no longer has. One that is there with its signature beside it,
      # which goes up after it, is used instead of this build's.
      - name: The runtimes updates has already
        if: needs.version.outputs.rolling != 'true'
        run: |
          there=$(gh release view "$FILES" --json assets --jq '.assets[] | "\(.name) \(.size)"')
          find artifacts -type f -name 'chromium-runtime-*.tar.gz' | while read -r archive; do
            name=$(basename "$archive")
            size=$(awk -v name="$name" '$1 == name { print $2 }' <<<"$there")
            if [ -z "$size" ] || ! grep -qF "$name.sig " <<<"$there"; then
              continue
            fi
            gh release download "$FILES" --pattern "$name.sig" --output "$archive.sig" --clobber
            node scripts/runtime-size.mjs artifacts "$name" "$size"
            rm "$archive"
            echo "$name: the one on $FILES"
          done

      # What the Browser setting reads first; see scripts/chromium-manifest.mjs. None at
      # all where no platform's engine built and signed.
      - name: Build chromium.json
        run: node scripts/chromium-manifest.mjs "$VERSION" artifacts > chromium.json || rm -f chromium.json

      - name: Upload the files
        run: |
          # Every file before the manifest that names it: a fetch never reads a
          # chromium.json whose archives are not there yet, and the updater is never
          # offered a version whose installer or Chromium is still on its way.
          if [ -f chromium.json ]; then
            find artifacts -type f -name 'nib-chromium-*.tar.gz' -exec gh release upload "$FILES" {} --clobber \;
            # A runtime's signature after the runtime, so a signature on `updates` says
            # the file beside it is whole.
            find artifacts -type f -name 'chromium-runtime-*.tar.gz' | while read -r runtime; do
              gh release upload "$FILES" "$runtime" --clobber
              if [ "$ROLLING" != true ]; then gh release upload "$FILES" "$runtime.sig" --clobber; fi
            done
            # `updates` holds every version's, so each is named for its version.
            manifest=chromium.json
            if [ "$ROLLING" != true ]; then
              manifest="chromium-$VERSION.json"
              cp chromium.json "$manifest"
            fi
            gh release upload "$FILES" "$manifest" --clobber
          fi

          if [ "$ROLLING" = true ]; then
            # The .app.tar.gz is what the updater downloads on a Mac, so it has to
            # be a release asset even though nobody clicks it.
            find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.app.tar.gz' \) \
              -exec gh release upload "$TAG" {} --clobber \;
          else
            # What latest.json names: the setups, the AppImages and the Mac's .app.tar.gz.
            find artifacts -type f \( -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.app.tar.gz' \) \
              -exec gh release upload "$FILES" {} --clobber \;
            # And the installers, under the product's name, on the release's own page.
            mkdir installers
            find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \) |
              while read -r file; do
                name=$(basename "$file")
                cp "$file" "installers/Orden-${name#Nib-}"
              done
            ls -l installers
            gh release upload "$TAG" installers/* --clobber
          fi
          gh release upload "$TAG" latest.json --clobber

      # GitHub creates no workflow run for an event raised by GITHUB_TOKEN, so
      # the release published above never reaches publish.yml's `on: release`, nor
      # publish-linux.yml's. workflow_dispatch is the documented exception to that
      # rule, so the release hands itself over explicitly. Only a real tag: `edge` is
      # remade on every push to main and is not something to publish anywhere. And to
      # packaging-bump.yml, which moves the manifests in packaging/ onto it, the flake
      # people install from this repository first of all.
      - name: Hand the release to the package managers
        if: needs.version.outputs.rolling != 'true'
        run: |
          gh workflow run publish.yml -f tag="$TAG"
          gh workflow run publish-linux.yml -f tag="$TAG"
          gh workflow run packaging-bump.yml -f tag="$TAG"
