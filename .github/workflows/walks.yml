name: walks

# Sync v2's engine as every device of the simulator, ten thousand seeds from the day's
# own number, every night (apps/desktop/src/lib/sync2/walks/walk.ts). check.yml walks
# the same fixed seeds on every push; these are seeds no run walked before. A failure
# names its seed, which replays with `SIM_FROM=<seed> SIM_SEEDS=1`. Never on a push:
# what it finds is read the next morning.
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

concurrency:
  group: walks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  walks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ten thousand new seeds
        run: SIM_FROM=$(( $(date +%s) / 86400 * 10000 )) pnpm --filter @nib/desktop sim:long
