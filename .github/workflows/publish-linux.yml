name: publish-linux

# Pushes a finished release out to the Linux package managers that take an
# upload. Each job is a no-op until its credentials exist as repository
# secrets, so this can sit here doing nothing until an account is made -
# packaging/linux.md has the steps for each one.
#
# Not here on purpose:
#   Flathub  - updates arrive as a pull request from Flathub's own
#              flatpak-external-data-checker, which reads the x-checker-data in
#              packaging/flathub/ch.emilvinu.nib.yml. Nothing to push.
#   AppImage - the release page is the distribution channel.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish (e.g. v0.4.0)
        required: true

# The floor, so a job added below without a block of its own still only reads.
# Every job states its own as well, because what a job may do is part of what the
# job is. Both roads out of here - the AUR over ssh, the Snap Store over its own
# credentials - leave GitHub entirely, so neither needs a token that writes.
permissions:
  contents: read

jobs:
  aur:
    name: AUR (nib-bin)
    runs-on: ubuntu-latest
    # It reads the repository and fetches this release's own .debs over plain
    # https. The push to aur.archlinux.org travels on an ssh key.
    permissions:
      contents: read
    # `edge` is remade on every push to main and is not a release anyone should
    # be installing from a package manager.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      HAS_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Point the PKGBUILD at this release
        working-directory: packaging/aur/nib-bin
        run: |
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # Both architectures at once: updpkgsums would only ever fix the sums
          # for the machine it runs on and would quietly leave the other wrong.
          sum() { curl -fsSL "$1" | sha256sum | cut -d' ' -f1; }
          x64=$(sum "$base/Nib-$version-linux-x64.deb")
          arm64=$(sum "$base/Nib-$version-linux-arm64.deb")
          desktop=$(sha256sum nib.desktop | cut -d' ' -f1)

          sed -i \
            -e "s/^pkgver=.*/pkgver=$version/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('$desktop')/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$x64')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$arm64')/" \
            PKGBUILD
          cat PKGBUILD

      # Pinned by digest, not by `base-devel`. The tag is rebuilt daily and the
      # image it names is what builds and checks the package that then goes to
      # every Arch user, so the image that ran is the image that was read. The
      # `pacman -Syu` below is what keeps the packages inside it current, so
      # pinning costs nothing in freshness: the digest is raised here when
      # somebody decides to, rather than by whoever last pushed the tag.
      - name: Check it still builds, before anything is pushed
        env:
          ARCH_IMAGE: archlinux:base-devel@sha256:61f7de2dd88cc4ba1fe36c24cfe1a503c3936984492d6405eeab013ce6ac68c5
        run: |
          cat > /tmp/aur.sh <<'SH'
          set -euo pipefail
          pacman -Syu --noconfirm --needed namcap sudo
          useradd -m builduser
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builduser
          chmod 440 /etc/sudoers.d/builduser
          install -d /build && cp -r /repo/packaging/aur/nib-bin/. /build/
          chown -R builduser: /build
          cd /build
          sudo -u builduser makepkg --printsrcinfo > .SRCINFO
          cat .SRCINFO
          sudo -u builduser makepkg -f --noconfirm --syncdeps --noprogressbar
          namcap ./*.pkg.tar.zst
          SH
          docker run --rm -v "$PWD:/repo" -v /tmp/aur.sh:/aur.sh "$ARCH_IMAGE" bash /aur.sh

      # Generates .SRCINFO itself and pushes to ssh://aur@aur.archlinux.org.
      #
      # Pinned to a commit and not to a tag. This is the step handed the AUR
      # account's own SSH key, and a tag is a name its owner can move: pinning
      # means the code that gets the key is the code that was read.
      - name: Push to the AUR
        if: env.HAS_KEY == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: nib-bin
          pkgbuild: packaging/aur/nib-bin/PKGBUILD
          assets: packaging/aur/nib-bin/nib.desktop
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: nib ${{ env.TAG }}

      - name: No AUR key yet
        if: env.HAS_KEY != 'true'
        run: |
          echo "### AUR not published" >> "$GITHUB_STEP_SUMMARY"
          echo "The PKGBUILD builds, but AUR_SSH_PRIVATE_KEY is not set, so nothing was pushed." >> "$GITHUB_STEP_SUMMARY"
          echo "See packaging/linux.md for how to create the account and add the secrets." >> "$GITHUB_STEP_SUMMARY"

  snap:
    name: Snap Store (${{ matrix.arch }})
    # It reads the repository and uploads an artifact, which travels on the
    # runtime's own token rather than on this one. The upload to the Snap Store
    # goes on SNAPCRAFT_STORE_CREDENTIALS.
    permissions:
      contents: read
    # One snap per architecture, each built on a runner of that architecture:
    # snapcraft cross-builds nothing here, it only unpacks the matching .deb.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      HAS_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Point snapcraft.yaml at this release
        working-directory: packaging/snap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"

          # The digests the release page reports for the two files this unpacks, read
          # rather than computed: the bytes are snapcraft's to fetch, and what is
          # wanted here is what the release says they are. A missing one fails the
          # step - a snap built with no digest is a snap nobody checked.
          amd64="$(gh release view "$TAG" --repo "$REPO" --json assets --jq ".assets[] | select(.name == \"Nib-$version-linux-x64.deb\") | .digest" | sed 's|^sha256:||')"
          arm64="$(gh release view "$TAG" --repo "$REPO" --json assets --jq ".assets[] | select(.name == \"Nib-$version-linux-arm64.deb\") | .digest" | sed 's|^sha256:||')"

          for said in "$amd64" "$arm64"; do
            if [ -z "$said" ]; then
              echo "::error::the release page reports no sha256 for a linux .deb of $version"
              exit 1
            fi
          done

          sed -i \
            -e "s/^version: .*/version: '$version'/" \
            -e "s|/download/v[0-9][^/]*/Nib-[0-9][^-]*-linux-|/download/$TAG/Nib-$version-linux-|g" \
            -e "s|on amd64: sha256/.*|on amd64: sha256/$amd64|" \
            -e "s|on arm64: sha256/.*|on arm64: sha256/$arm64|" \
            snapcraft.yaml
          grep -nE "^version:|releases/download|sha256/" snapcraft.yaml

      # Pinned for the same reason: `v1` is a moving name, and the second of the
      # two is handed the Snap Store's credentials.
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build
        with:
          path: packaging/snap

      - uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        if: env.HAS_CREDENTIALS == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

      - name: No Snapcraft credentials yet
        if: env.HAS_CREDENTIALS != 'true'
        run: |
          echo "### Snap not published" >> "$GITHUB_STEP_SUMMARY"
          echo "The snap builds, but SNAPCRAFT_STORE_CREDENTIALS is not set, so nothing was uploaded." >> "$GITHUB_STEP_SUMMARY"
          echo "See packaging/linux.md for how to register the name and add the secret." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: snap-${{ matrix.arch }}
          path: packaging/snap/*.snap
          if-no-files-found: warn
