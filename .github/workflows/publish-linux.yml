name: publish-linux

# Pushes a finished release out to the Linux package managers that take an
# upload. Each job is a no-op until its credentials exist as repository
# secrets, so this can sit here doing nothing until an account is made -
# packaging/linux.md has the steps for each one.
#
# Not here on purpose:
#   Flathub  - Orden is not published there; see packaging/linux.md.
#   AppImage - the release page is the distribution channel.
#
# Called by release.yml for every stable release, once its files are up, and run by
# hand the same way (`gh workflow run publish-linux.yml -f tag=v0.15.0`). Called rather
# than dispatched, because a dispatch only finds a workflow on the default branch; and
# nothing listens for `release: published`, which a release made on the workflow's own
# token never raises and one made by hand would raise before its files were up.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to publish (e.g. v0.4.0)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish (e.g. v0.4.0)
        required: true

# The floor, so a job added below without a block of its own still only reads.
# Every job states its own as well, because what a job may do is part of what the
# job is. Both roads out of here - the AUR over ssh, the Snap Store over its own
# credentials - leave GitHub entirely, so neither needs a token that writes.
permissions:
  contents: read

jobs:
  aur:
    name: AUR (orden-bin)
    runs-on: ubuntu-latest
    # It reads the repository and fetches this release's own .debs over plain
    # https. The push to aur.archlinux.org travels on an ssh key.
    permissions:
      contents: read
    # `edge` is remade on every push to unstable and is not a release anyone should
    # be installing from a package manager.
    if: ${{ startsWith(inputs.tag, 'v') && !contains(inputs.tag, '-') }}
    env:
      TAG: ${{ inputs.tag }}
      HAS_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Point the PKGBUILD at this release
        working-directory: packaging/aur/nib-bin
        run: |
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # Both architectures at once: updpkgsums would only ever fix the sums
          # for the machine it runs on and would quietly leave the other wrong.
          sum() { curl -fsSL "$1" | sha256sum | cut -d' ' -f1; }
          x64=$(sum "$base/Orden-$version-linux-x64.deb")
          arm64=$(sum "$base/Orden-$version-linux-arm64.deb")
          desktop=$(sha256sum nib.desktop | cut -d' ' -f1)

          sed -i \
            -e "s/^pkgver=.*/pkgver=$version/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('$desktop')/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$x64')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$arm64')/" \
            PKGBUILD
          cat PKGBUILD

      # Pinned by digest, not by `base-devel`. The tag is rebuilt daily and the
      # image it names is what builds and checks the package that then goes to
      # every Arch user, so the image that ran is the image that was read. The
      # `pacman -Syu` below is what keeps the packages inside it current, so
      # pinning costs nothing in freshness: the digest is raised here when
      # somebody decides to, rather than by whoever last pushed the tag.
      - name: Check it still builds, before anything is pushed
        env:
          ARCH_IMAGE: archlinux:base-devel@sha256:61f7de2dd88cc4ba1fe36c24cfe1a503c3936984492d6405eeab013ce6ac68c5
        run: |
          cat > /tmp/aur.sh <<'SH'
          set -euo pipefail
          pacman -Syu --noconfirm --needed namcap sudo
          useradd -m builduser
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builduser
          chmod 440 /etc/sudoers.d/builduser
          install -d /build && cp -r /repo/packaging/aur/nib-bin/. /build/
          chown -R builduser: /build
          cd /build
          sudo -u builduser makepkg --printsrcinfo > .SRCINFO
          cat .SRCINFO
          sudo -u builduser makepkg -f --noconfirm --syncdeps --noprogressbar
          namcap ./*.pkg.tar.zst
          SH
          docker run --rm -v "$PWD:/repo" -v /tmp/aur.sh:/aur.sh "$ARCH_IMAGE" bash /aur.sh

      # Generates .SRCINFO itself and pushes to ssh://aur@aur.archlinux.org.
      #
      # Pinned to a commit and not to a tag. This is the step handed the AUR
      # account's own SSH key, and a tag is a name its owner can move: pinning
      # means the code that gets the key is the code that was read.
      - name: Push to the AUR
        if: env.HAS_KEY == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: orden-bin
          pkgbuild: packaging/aur/nib-bin/PKGBUILD
          assets: packaging/aur/nib-bin/nib.desktop
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: orden ${{ env.TAG }}

      - name: No AUR key yet
        if: env.HAS_KEY != 'true'
        run: |
          echo "### AUR not published" >> "$GITHUB_STEP_SUMMARY"
          echo "The PKGBUILD builds, but AUR_SSH_PRIVATE_KEY is not set, so nothing was pushed." >> "$GITHUB_STEP_SUMMARY"
          echo "See packaging/linux.md for how to create the account and add the secrets." >> "$GITHUB_STEP_SUMMARY"

  # The snap's own workflow, which release.yml calls as well for edge; see snap.yml.
  snap:
    if: ${{ startsWith(inputs.tag, 'v') && !contains(inputs.tag, '-') }}
    permissions:
      contents: read
    uses: ./.github/workflows/snap.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
