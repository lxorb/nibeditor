name: validate-linux-packaging

# Everything under packaging/ that targets Linux, built the way the package
# managers themselves build it: makepkg in an Arch container and snapcraft in LXD.
# Not Flathub, which Orden is not published on; its manifest under
# packaging/flathub is kept for reference and built by nothing here.
# Run by hand, because it only matters when a release moves. Nix has a workflow
# of its own, nix.yml, which runs on every change to the flake.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The released version to package
        default: '0.4.0'
  # workflow_dispatch alone only fires for files that are on the default
  # branch, so a branch validating packaging has to run itself on push.
  push:
    branches: ['validate-linux-packaging']

env:
  VERSION: ${{ inputs.version || '0.4.0' }}

# The floor, so a job added below without a block of its own still only reads.
# Every job states its own as well, because what a job may do is part of what the
# job is. Nothing in this file writes anywhere: it builds every Linux package from
# a release that already exists and reports what came out.
permissions:
  contents: read

jobs:
  # What Tauri actually put in the .deb, since every Linux package unpacks it.
  deb:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils

      - name: Fetch the release .debs
        run: |
          mkdir -p dl
          # Called Orden from 0.15, Nib before.
          for arch in x64 arm64; do
            for name in Orden Nib; do
              curl -fsSL -o "dl/Nib-$VERSION-linux-$arch.deb" \
                "https://github.com/lxorb/orden/releases/download/v$VERSION/$name-$VERSION-linux-$arch.deb" && break
            done
          done
          sha256sum dl/*.deb

      # What the snap says those bytes are. The `.deb` is fetched on a runner and
      # unpacked into a package the Snap Store publishes under this name, so the
      # digest in snapcraft.yaml is the one thing standing between a tampered asset
      # and everybody's App Center. Compared here because this is the job that has
      # the bytes; the unit test beside the app only reads the shape.
      - name: The digests the snap pins
        run: |
          for arch in x64 arm64; do
            case "$arch" in
              x64) said=amd64 ;;
              *) said=arm64 ;;
            esac

            want="$(sha256sum "dl/Nib-$VERSION-linux-$arch.deb" | cut -d' ' -f1)"
            held="$(sed -n "s|.*on $said: sha256/\([0-9a-f]*\).*|\1|p" packaging/snap/snapcraft.yaml)"

            echo "$said: snapcraft.yaml says $held"
            if [ "$want" != "$held" ]; then
              echo "::error::packaging/snap/snapcraft.yaml pins $held for $said; the release is $want"
              exit 1
            fi
          done

      - name: What is inside
        run: |
          for f in dl/*.deb; do
            echo "::group::$f"
            dpkg-deb -I "$f"
            dpkg-deb -c "$f"
            echo "::endgroup::"
          done

      - name: Tauri's own .desktop entry
        run: |
          dpkg-deb -x "dl/Nib-$VERSION-linux-x64.deb" x
          # Named after the product: Nib.desktop up to 0.11, nibeditor.desktop up to
          # 0.13, Orden.desktop since.
          entry=$(ls x/usr/share/applications/*.desktop | head -1)
          cat "$entry"
          # Not a gate: this is the file the packaging replaces, and it is
          # expected to be thin. Reported so a regression stays visible.
          desktop-file-validate "$entry" && echo 'valid' || echo 'invalid'
          file x/usr/bin/nib
          objdump -p x/usr/bin/nib | grep NEEDED

      - name: What the AppImage bundles
        run: |
          for name in Orden Nib; do
            curl -fsSL -o Nib.AppImage \
              "https://github.com/lxorb/orden/releases/download/v$VERSION/$name-$VERSION-linux-x64.AppImage" && break
          done
          chmod +x Nib.AppImage
          ./Nib.AppImage --appimage-extract >/dev/null
          echo "::group::AppDir"
          find squashfs-root -maxdepth 4 -printf '%y %p\n' | sort | head -60
          echo "::endgroup::"
          find squashfs-root -name '*webkit*' -o -name '*javascriptcore*' -o -name 'WebKit*'

      - name: The .desktop entries the packaging ships instead
        run: |
          desktop-file-validate packaging/aur/nib-bin/nib.desktop
          desktop-file-validate packaging/nix/orden.desktop
          desktop-file-validate packaging/flathub/so.orden.Orden.desktop

  aur:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The same digest publish-linux.yml pins, and for the same reason: the
      # `base-devel` tag is rebuilt daily, and this row is what decides whether
      # the PKGBUILD that goes to every Arch user builds at all. Two files
      # answering that question from two different images is two answers. The
      # `pacman -Syu` inside keeps the packages current, so the pin costs no
      # freshness; it is raised when somebody decides to.
      - name: makepkg in an archlinux container
        env:
          ARCH_IMAGE: archlinux:base-devel@sha256:61f7de2dd88cc4ba1fe36c24cfe1a503c3936984492d6405eeab013ce6ac68c5
        run: |
          mkdir -p out
          cat > /tmp/aur.sh <<'SH'
          set -euo pipefail
          pacman -Syu --noconfirm --needed namcap sudo desktop-file-utils
          useradd -m builduser
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builduser
          chmod 440 /etc/sudoers.d/builduser
          install -d /build
          cp -r /repo/packaging/aur/nib-bin/. /build/
          chown -R builduser: /build
          cd /build

          echo "::group::.SRCINFO"
          sudo -u builduser makepkg --printsrcinfo | tee /repo/out/SRCINFO
          echo "::endgroup::"

          echo "::group::makepkg"
          sudo -u builduser makepkg -f --noconfirm --syncdeps --noprogressbar
          echo "::endgroup::"

          echo "::group::namcap"
          namcap PKGBUILD
          namcap ./*.pkg.tar.zst
          echo "::endgroup::"

          echo "::group::package contents"
          bsdtar -tf ./*.pkg.tar.zst
          echo "::endgroup::"

          # The repairs the PKGBUILD makes have to have landed.
          install -d /check
          bsdtar -xf ./*.pkg.tar.zst -C /check
          test -f /check/usr/share/applications/nib.desktop
          for tauri in Nib nibeditor Orden; do
            test ! -e "/check/usr/share/applications/$tauri.desktop"
          done
          test -f /check/usr/share/icons/hicolor/256x256/apps/nib.png
          test ! -e /check/usr/share/icons/hicolor/256x256@2
          test -x /check/usr/bin/nib
          desktop-file-validate /check/usr/share/applications/nib.desktop
          echo 'installed layout ok'

          # The committed .SRCINFO has to be the one makepkg generates.
          diff -u /repo/packaging/aur/nib-bin/.SRCINFO /repo/out/SRCINFO
          echo '.SRCINFO is current'
          SH
          docker run --rm -v "$PWD:/repo" -v /tmp/aur.sh:/aur.sh "$ARCH_IMAGE" bash /aur.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: srcinfo
          path: out/SRCINFO
          if-no-files-found: warn

  snap:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The snap stages no WebKitGTK of its own, so the platform snap the
      # gnome extension pulls in has to be the one carrying it.
      - name: What the gnome platform snap carries
        run: |
          snap download gnome-46-2404 --basename=gnome-platform
          unsquashfs -l gnome-platform.snap | grep -E "libwebkit2gtk-4[.]1|libjavascriptcoregtk-4[.]1|libsoup-3" | tee webkit.txt
          grep -q "libwebkit2gtk-4[.]1[.]so[.]0$" webkit.txt
          echo "webkit2gtk-4.1 comes from the platform snap"

      # snapcraft reads one checksum line, amd64's as committed; the arm64 row takes
      # the arm64 digest the file keeps beside it. See packaging/linux.md.
      - name: This architecture's checksum
        if: matrix.arch == 'arm64'
        working-directory: packaging/snap
        run: |
          own=$(sed -nE 's/^ *# *on arm64: (sha256\/[0-9a-f]{64})$/\1/p' snapcraft.yaml)
          [ -n "$own" ] || { echo "::error::snapcraft.yaml keeps no arm64 digest"; exit 1; }
          sed -i -E "s|^( *source-checksum: ).*|\1$own|" snapcraft.yaml
          grep -n 'source-checksum' snapcraft.yaml

      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build
        with:
          path: packaging/snap
      - name: What came out
        run: |
          ls -la "${{ steps.build.outputs.snap }}"
          unsquashfs -l "${{ steps.build.outputs.snap }}" | head -40
          unsquashfs -d /tmp/snapx "${{ steps.build.outputs.snap }}" >/dev/null
          cat /tmp/snapx/meta/snap.yaml
          test -f /tmp/snapx/usr/share/applications/nib.desktop
          for tauri in Nib nibeditor Orden; do
            test ! -e "/tmp/snapx/usr/share/applications/$tauri.desktop"
          done
          ls /tmp/snapx/meta/gui/ || true
          find /tmp/snapx -name 'libwebkit2gtk*' -o -name 'libgtk-3*' | head
