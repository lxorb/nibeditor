# Keeping up with Chromium, as a button.
#
# Emil's requirement for the engine was *"we don't need to do anything manually
# when there are upstream changes"*. The engine's cadence is CEF's - a branch per
# Chromium milestone, about four weeks apart, `cef-rs` publishing within days of
# each and `tauri-runtime-cef` taking whatever `cef-rs` has - so nib's part is to
# follow the published crates, rebuild, re-measure and put the numbers in front of a
# person. Weekly, and whenever somebody asks.
#
# What it does: moves the pins in apps/desktop/src-tauri/cef/Cargo.toml
# (`[package.metadata.engine]`) to the newest published set that belongs together -
# bump.py says what that means - writes the dependency list again from them, builds the
# engine on the two desktops that offer it, runs the same gate .github/workflows/cef.yml
# runs, and opens a **draft** pull request with the table and with what moved. Nobody
# edits a version number by hand; a person presses merge, or does not.
#
# It never runs on a pull request and never on a branch: a scheduled workflow runs
# on the default branch, and the only thing it pushes is the branch its own pull
# request is for. See docs/browser.md, section 7.
name: cef-bump

on:
  schedule:
    # Monday morning, after CEF's own weekly builds and before anybody looks.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      pins:
        description: 'Move the pins to exactly these, as JSON, rather than the newest set'
        type: string
        default: ''

concurrency:
  group: cef-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # What upstream has now, against what nib is pinned to. Cheap, and it decides
  # whether anything below runs at all.
  pin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      moved: ${{ steps.look.outputs.moved }}
      pins: ${{ steps.look.outputs.pins }}
      report: ${{ steps.look.outputs.report }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - id: look
        shell: bash
        env:
          ASKED: ${{ inputs.pins }}
        run: |
          if [ -n "$ASKED" ]; then
            python -c "import json,os; print(json.dumps({'moved': True, 'from': {}, 'to': json.loads(os.environ['ASKED'])}, indent=2))" > bump.json
          else
            python apps/desktop/src-tauri/cef/bump.py --out bump.json
          fi
          echo "moved=$(python -c "import json;print(str(json.load(open('bump.json'))['moved']).lower())")" >>"$GITHUB_OUTPUT"
          echo "pins=$(python -c "import json;print(json.dumps(json.load(open('bump.json'))['to'], separators=(',', ':')))")" >>"$GITHUB_OUTPUT"
          # The delimiter has to be on a line of its own; the echo makes sure of it.
          {
            echo 'report<<REPORT'
            cat bump.json
            echo
            echo REPORT
          } >>"$GITHUB_OUTPUT"

      - name: What moved
        shell: bash
        run: |
          {
            echo '## The pin'
            echo
            echo '```json'
            cat bump.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cef-bump-pin
          path: bump.json
          retention-days: 7

  # The same build, tests, pack and gate cef.yml runs, on the pins above. Its own job
  # per platform so a red Mac is a row in the pull request rather than the end of the
  # run.
  gate:
    needs: pin
    if: needs.pin.outputs.moved == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x86_64
          - runner: macos-latest
            platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    continue-on-error: true
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      NIB_CEF_ARGS: enable-logging=stderr
      CEF_DIR: ${{ github.workspace }}/.cef
      PINS: ${{ needs.pin.outputs.pins }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the stable branch
        with:
          toolchain: stable

      - name: Move the pins
        run: python apps/desktop/src-tauri/cef/bump.py --set "$PINS"

      - name: The frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nib/desktop build

      - name: The app as it ships
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --release

      - name: The engine
        run: bash apps/desktop/src-tauri/cef/engine.sh "$(rustc -vV | sed -n 's/^host: //p')"

      - name: Where a run's spaces go
        run: echo "NIB_SPACES_DIR=${{ runner.temp }}/nib-spaces" >>"$GITHUB_ENV"

      # Moved pins are a new resolution: the lock file is made again rather than
      # honoured, and the new one is part of what the pull request carries.
      - name: The engine build
        working-directory: apps/desktop/src-tauri/cef
        run: |
          cargo generate-lockfile
          cargo build --release

      - name: Its tests
        working-directory: apps/desktop/src-tauri/cef
        run: cargo test --release

      - name: Pack
        run: |
          suffix=''
          [ "${{ runner.os }}" = "Windows" ] && suffix='.exe'
          python apps/desktop/src-tauri/cef/pack.py \
            --binary "apps/desktop/src-tauri/cef/target/release/nib-chromium$suffix" \
            --engine "$CEF_PATH" --version 0.0.0 --platform "${{ matrix.platform }}" --out chromium-out

      - name: Run the gate
        env:
          NIB_CEF_SANDBOX: disabled
        run: |
          suffix=''
          [ "${{ runner.os }}" = "Windows" ] && suffix='.exe'
          python apps/desktop/src-tauri/cef/gate.py \
            --cef "apps/desktop/src-tauri/cef/target/release/nib-chromium$suffix" \
            --control "apps/desktop/src-tauri/target/release/nib$suffix" \
            --engine "$CEF_PATH" \
            --extension spike/browser/extension \
            --out gate-out

      - name: The gate table
        if: always()
        run: |
          mkdir -p bumped
          cp gate-out/gate.md "bumped/${{ matrix.platform }}.md" 2>/dev/null || true
          cp apps/desktop/src-tauri/cef/Cargo.lock bumped/Cargo.lock 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cef-bump-${{ matrix.platform }}
          path: |
            bumped/**
            gate-out/**
          if-no-files-found: warn
          retention-days: 7

  # And the button: a draft pull request with the pins moved, the lock file they
  # resolved to, and the two tables in the body. Draft, because a person decides
  # whether the Chromium every Chromium user of nib gets next is the one nib wants.
  #
  # **It only ever opens one from the default branch.** A `workflow_dispatch` can be
  # asked for on any ref - which is how the plumbing gets proved without waiting for a
  # Monday - and a branch nobody releases from must not be able to push a `cef-pin-*`
  # branch or open a pull request against main by accident. So this job runs
  # everywhere, builds the body everywhere, puts it in the job summary everywhere, and
  # pushes nothing anywhere but the default branch.
  propose:
    needs: [pin, gate]
    if: always() && needs.pin.outputs.moved == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: artefacts

      - name: The branch
        id: branch
        shell: bash
        env:
          PINS: ${{ needs.pin.outputs.pins }}
        run: |
          short=$(python -c "import json,os; p=json.loads(os.environ['PINS']); print(p['tauri-runtime-cef'] + '-cef-' + p['cef'])")
          echo "name=cef-pin-$short" >>"$GITHUB_OUTPUT"
          echo "short=$short" >>"$GITHUB_OUTPUT"

      # The written half of the manifest is made by a Node script.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Move the pins and take the lock file the runners resolved
        shell: bash
        env:
          PINS: ${{ needs.pin.outputs.pins }}
        run: |
          python apps/desktop/src-tauri/cef/bump.py --set "$PINS"
          lock=$(find artefacts -name 'Cargo.lock' -path '*bumped*' | head -1)
          if [ -n "$lock" ]; then
            cp "$lock" apps/desktop/src-tauri/cef/Cargo.lock
          fi

      - name: The body
        shell: bash
        run: |
          {
            echo "The engine's pins move to \`${{ steps.branch.outputs.short }}\`."
            echo
            echo '```json'
            cat <<'REPORT'
          ${{ needs.pin.outputs.report }}
          REPORT
            echo '```'
            echo
            echo '## The gate'
            echo
            for table in artefacts/*/bumped/*.md; do
              [ -f "$table" ] || continue
              echo "### $(basename "$table" .md)"
              echo
              cat "$table"
              echo
            done
            echo
            echo 'Draft on purpose: a new engine is what every Chromium user of nib runs'
            echo 'next, so a person reads the table before merging.'
          } >body.md
          cat body.md
          {
            echo '## The pull request this would open'
            echo
            cat body.md
          } >>"$GITHUB_STEP_SUMMARY"

      # The guard, and it is a step rather than a job condition so that a dispatch on
      # any other ref still proves everything above it works.
      - name: Whether this may open a pull request
        id: allowed
        shell: bash
        run: |
          default='${{ github.event.repository.default_branch }}'
          default=${default:-main}
          if [ "${{ github.ref_name }}" = "$default" ]; then
            echo 'may=true' >>"$GITHUB_OUTPUT"
          else
            echo 'may=false' >>"$GITHUB_OUTPUT"
            echo "This ran on \`${{ github.ref_name }}\` rather than \`$default\`, so nothing was pushed and no pull request was opened." >>"$GITHUB_STEP_SUMMARY"
            echo "not the default branch ($default): nothing pushed, no pull request"
          fi

      - name: Open it
        if: steps.allowed.outputs.may == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          branch='${{ steps.branch.outputs.name }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add apps/desktop/src-tauri/cef/Cargo.toml apps/desktop/src-tauri/cef/Cargo.lock
          git commit -m "chore: cef pin ${{ steps.branch.outputs.short }}"
          git push --force origin "$branch"
          gh pr create --draft --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "chore: cef pin ${{ steps.branch.outputs.short }}" \
            --body-file body.md || gh pr edit "$branch" --body-file body.md
