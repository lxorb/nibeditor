name: nix

# The flake in packaging/nix, the way somebody on NixOS meets it: `nix flake check`,
# `nix build`, and then Orden started out of it in a headless sway, once as a
# native Wayland client with no X server at all and once on X11 through Xwayland,
# on both architectures; see scripts/nix-start.sh. Orden has no
# --version to ask, so a start is the test: a window has to come up and the app
# has to stay up, with nothing in its log about a missing library or a display it
# could not open.
#
# On a pull request it builds the flake in the checkout. On main, and by hand, it
# builds the flake from GitHub, the way `nix run github:lxorb/orden?dir=packaging/nix`
# does. packaging-bump.yml and nix-edge.yml call it twice each: on the rewritten
# flake before it lands, and from GitHub after.
on:
  pull_request:
    paths:
      - packaging/nix/**
      - scripts/bump-packaging.mjs
      - .github/workflows/nix.yml
      - .github/workflows/packaging-bump.yml
      - .github/workflows/nix-edge.yml
      - scripts/nix-start.sh
  push:
    branches: [main]
    paths:
      - packaging/nix/**
      - scripts/nix-start.sh
      - .github/workflows/nix.yml
  workflow_dispatch:
    inputs:
      flake:
        description: The flake to start, as `nix run` takes it
        default: github:lxorb/orden?dir=packaging/nix
  workflow_call:
    inputs:
      flake:
        description: The flake to start; the checkout's packaging/nix when empty
        type: string
        default: ''
      artifact:
        description: An artifact of the calling run laid over packaging/ first
        type: string
        default: ''

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}-${{ inputs.flake }}-${{ inputs.artifact }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes anywhere.
permissions:
  contents: read

jobs:
  start:
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
            other: aarch64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            other: x86_64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
          path: packaging

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Which flake
        id: flake
        env:
          ASKED: ${{ inputs.flake }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$ASKED" ]; then
            flake="$ASKED"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            flake="github:$GITHUB_REPOSITORY/$SHA?dir=packaging/nix"
          else
            flake="path:$PWD/packaging/nix"
          fi
          echo "flake=$flake" >>"$GITHUB_OUTPUT"
          echo "### $flake" >>"$GITHUB_STEP_SUMMARY"

      - name: nix flake check
        env:
          FLAKE: ${{ steps.flake.outputs.flake }}
        run: nix flake check --all-systems --print-build-logs "$FLAKE"

      # Nix refuses to run a flake from GitHub whose lock file it would have to
      # change, so the committed flake.lock has to be the one these commands
      # settle on.
      - name: flake.lock is committed and current
        if: startsWith(steps.flake.outputs.flake, 'path:')
        run: |
          git status --porcelain packaging/nix
          if [ -n "$(git status --porcelain packaging/nix/flake.lock)" ] && [ -z "${{ inputs.artifact }}" ]; then
            echo "::error::packaging/nix/flake.lock is missing or stale"
            exit 1
          fi

      # The other architecture only evaluates here; its own runner builds it.
      - name: The ${{ matrix.other }} package evaluates
        env:
          FLAKE: ${{ steps.flake.outputs.flake }}
        run: nix eval --raw "$FLAKE#packages.${{ matrix.other }}.default.name"

      - name: nix build
        env:
          FLAKE: ${{ steps.flake.outputs.flake }}
        run: |
          nix build --print-build-logs "$FLAKE" -o result
          # orden, or orden-edge on the nix-edge branch: every file a profile gets
          # is named after it, so the two never collide.
          pname=$(nix eval --raw "$FLAKE#default.pname")
          echo "### $pname $(nix eval --raw "$FLAKE#default.version")" >>"$GITHUB_STEP_SUMMARY"
          find result/bin result/share -type f -o -type l | sort | tee files.txt
          if [ "$pname" = orden ]; then
            test "$(readlink result/bin/nib)" = orden
            expected=2
          else
            expected=1
          fi
          test "$(find result/bin -mindepth 1 | wc -l)" -eq "$expected"
          # What the wrapper sets: no display backend forced on anyone, and the
          # DMA-BUF renderer off on NVIDIA's driver alone.
          cat "result/bin/$pname"
          if grep -n GDK_BACKEND "result/bin/$pname"; then exit 1; fi
          grep -q '/proc/driver/nvidia/version ]; then export WEBKIT_DISABLE_DMABUF_RENDERER=1' "result/bin/$pname"
          nix shell nixpkgs#pax-utils -c lddtree "result/libexec/$pname/nib" | head -80
          nix shell nixpkgs#desktop-file-utils -c desktop-file-validate "result/share/applications/$pname.desktop"
          cat "result/share/applications/$pname.desktop"
          for size in 32x32 128x128 256x256; do
            test -s "result/share/icons/hicolor/$size/apps/$pname.png"
          done

      # On NixOS, hardware.graphics puts Mesa (or the GPU's own driver) in
      # /run/opengl-driver, which is where nixpkgs' libglvnd looks for one. Without
      # it WebKit's web process aborts on its first frame. The runner gets the
      # same, out of the flake's own nixpkgs.
      - name: A graphics driver where NixOS keeps it
        env:
          FLAKE: ${{ steps.flake.outputs.flake }}
        run: |
          mesa=$(nix build --no-link --print-out-paths --no-write-lock-file --inputs-from "$FLAKE" nixpkgs#mesa | head -1)
          sudo ln -sfn "$mesa" /run/opengl-driver
          ls -la /run/opengl-driver/ /run/opengl-driver/share/glvnd/egl_vendor.d

      - name: sway, Xwayland and the tools that look at them
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sway xwayland grim jq

      - name: It starts on Wayland
        id: wayland
        env:
          FLAKE: ${{ steps.flake.outputs.flake }}
        run: bash scripts/nix-start.sh wayland "$FLAKE"

      - name: It starts on X11, through Xwayland
        if: ${{ !cancelled() && steps.wayland.outcome != 'skipped' }}
        env:
          FLAKE: ${{ steps.flake.outputs.flake }}
        run: bash scripts/nix-start.sh x11 "$FLAKE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nix-${{ matrix.system }}${{ inputs.artifact != '' && '-bumped' || '' }}${{ inputs.flake != '' && '-github' || '' }}
          path: |
            *.png
            *.log
            wayland.*
            x11.*
            files.txt
            packaging/nix/flake.lock
          if-no-files-found: warn
