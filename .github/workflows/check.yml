name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  # Superseding a branch run saves wasted minutes. Superseding a main run can
  # cancel it between the migration and the Worker deploy, leaving the database
  # ahead of the code that reads it - so main queues instead of cancelling.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The floor, so a job added below without a block of its own still only reads.
# Every job states its own as well, because what a job may do is part of what the
# job is.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Every job in this file says what its token may do, and every one of them
    # only reads: nothing here writes a release, opens a pull request or touches
    # a package. A job with no block of its own inherits whatever the
    # repository's default is, which is a permission nobody chose for it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version here: it comes from the root package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: Dead code and unused dependencies
        run: pnpm knip

      - name: Tests
        run: pnpm test

  # All three platforms, because the crate is not one body of code. The taskbar's
  # recent documents list, Explorer's New menu and the PDF printer are behind a
  # Windows cfg gate, the Apple Notes reader is behind a macOS one - SQLite,
  # gzipped protobufs and a group container no other system has - and code a
  # runner does not compile is code no lint reads and no test runs. No row waits
  # on another: a lint that only fires on one platform should say which.
  rust:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # One spelling of every step below, whichever runner reads it.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the stable branch
        with:
          # Named, and not left to the `@stable` the ref used to carry: with the
          # action pinned to a commit, the ref no longer says which toolchain to
          # install, and this is the input that does.
          toolchain: stable
          components: clippy, rustfmt

      # The cache key this action builds already carries the runner's own OS, so
      # the two rows keep two caches without being told to.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            apps/desktop/src-tauri

      # Tauri needs the system webview to compile against. Windows has WebView2 in
      # the image already and macOS has WebKit in the system; only Linux has to be
      # handed one.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      # Tauri's build script embeds the built frontend, so it has to exist
      # before the crate will even compile.
      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nib/desktop build

      - name: Format
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      # `--all-targets` so the tests are linted and, more to the point, compiled:
      # a test module that does not build is invisible to a plain clippy run, and
      # the tests it holds then quietly stop running.
      - name: Clippy
        run: |
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  # Whether the phone's own half of the app changed. Its own job so the answer is
  # one `if` on the job below rather than one on each of its steps, and because
  # `on.paths` would gate the whole workflow rather than one job of it.
  #
  # It answers yes when it cannot tell. A shallow clone, a force push and the
  # first push to a branch all leave nothing to compare against, and spending ten
  # minutes for nothing is cheaper than letting a broken manifest through.
  android-touched:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      touched: ${{ steps.look.outputs.touched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: look
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "nothing to compare against; building anyway"
            echo "touched=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "$changed"

          if echo "$changed" | grep -qE '^(apps/desktop/src-tauri/|\.github/workflows/check\.yml$)'; then
            echo "touched=true" >>"$GITHUB_OUTPUT"
          else
            echo "touched=false" >>"$GITHUB_OUTPUT"
          fi

  # The Kotlin, the manifest, the resources and R8. Nothing else in the project
  # does: `check.yml`'s rust job builds the crate for the runner's own platform,
  # and the Android project is only ever assembled by publish-mobile.yml, which
  # does not run on a pull request - so until this job existed, a manifest that
  # would not build or a Kotlin file that would not compile reached main and was
  # found by a release.
  #
  # The release APK, and not the debug one. A debug assembly does not run R8, and
  # the first version of this job built one: it went green, and publish-mobile
  # failed one step further on with a keep rule R8 wanted. The variant is what has
  # to match, so this runs the same command with the same two targets and only the
  # signing left out - a runner with no keystore.properties produces an unsigned
  # APK, which is the last step of all. See docs/mobile.md.
  android-check:
    needs: android-touched
    if: needs.android-touched.outputs.touched == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # The Android Gradle plugin runs on 17; the runner's default is newer.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: The NDK the crate is cross-compiled with
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >>"$GITHUB_ENV"

      # The same two targets publish-mobile passes, because that is what decides
      # the variant: two or more of them and the CLI builds the `universal`
      # flavour, which is the one R8 runs over there.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the stable branch
        with:
          # Named, and not left to the `@stable` the ref used to carry: with the
          # action pinned to a commit, the ref no longer says which toolchain to
          # install, and this is the input that does.
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: android

      - run: pnpm install --frozen-lockfile

      # The same command publish-mobile runs, without the signing: a runner that
      # was given no keystore.properties simply produces an unsigned release APK,
      # and every step before that - the Kotlin, the manifest merge, the resources
      # and R8 - is the same work on the same variant.
      #
      # This builds the frontend itself, through the config's beforeBuildCommand.
      - name: Assemble the release APK, R8 and all
        run: |
          pnpm --filter @nib/desktop exec tauri android build --apk \
            --target aarch64 --target x86_64

      - name: Say what came out
        run: |
          find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print

      # R8 writes what it could not resolve here whether or not it goes on to fail,
      # so this is worth reading on a green run too: a rule that is no longer
      # needed and a new dependency's dangling reference both show up in it.
      - name: What R8 could not resolve
        if: always()
        run: |
          mapping=apps/desktop/src-tauri/gen/android/app/build/outputs/mapping
          if [ -d "$mapping" ]; then
            find "$mapping" -name 'missing_rules.txt' -print -exec cat {} ';'
          else
            echo "R8 wrote no mapping folder"
          fi

  # Whatever is on main is what nibeditor.com serves. Gated on the tests above,
  # so a red build never reaches anyone.
  deploy:
    # Only the types and tests. Clippy guards the desktop app, which is not
    # what this deploys, and coupling the two would let a lint stop a fix.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # The Worker and the database are reached with a Cloudflare token, not with
    # this one, so even the deploy only reads the repository.
    permissions:
      contents: read

    # Deploys queue rather than race. Cancelling one halfway is how a database
    # ends up migrated for a Worker that never arrived.
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Worker serves the built app from its assets binding, so the build
      # has to exist before the deploy reads it.
      - name: Build the web app
        run: pnpm --filter @nib/desktop build

      # Schema first. A new Worker may read a column the old schema lacks, and
      # the reverse - an unused new column - breaks nothing.
      #
      # `run` is spelled out in both steps below because `pnpm deploy` is a
      # pnpm command of its own, and swallows the package script otherwise.
      - name: Migrate the database
        run: pnpm --filter @nib/sync run migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy the Worker
        run: pnpm --filter @nib/sync run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
