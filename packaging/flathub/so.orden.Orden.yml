# Orden for Flathub, built from source in the sandbox.
#
# Flathub's requirements gained a "Building from source" section on 2026-02-25:
# a source-available submission has to be built entirely from source, so this
# manifest compiles the app rather than unpacking the release .deb. Nothing is
# fetched while it builds - every crate and every npm tarball is a source below,
# from the two generated files:
#
#   flatpak-cargo-generator.py apps/desktop/src-tauri/Cargo.lock -o packaging/flathub/cargo-sources.json
#   flatpak-node-generator pnpm pnpm-lock.yaml -o packaging/flathub/node-sources.json
#
# Both are run from the repository root. The cargo script's own dependencies are
# aiohttp and tomlkit now, not toml, and neither generator downloads anything:
# the hashes are the ones already in the lockfiles.
#
# Both are pinned to the same commit as the app and have to be regenerated
# whenever either lockfile moves. See packaging/linux.md.
#
# Tauri's own .desktop entry and icon layout are not reused - the entry it writes
# has no categories, no MIME types and no comment, and its 256x256 icon is filed
# under a scale-2 directory. The two files next to this manifest replace them,
# named after the app ID the way Flatpak requires, and the icons are installed
# from the source tree at the sizes they actually are.
id: so.orden.Orden
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
command: nib

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Syncing, publishing and the MCP server all talk to the network.
  - --share=network
  # The app ID here is the one Flathub takes; the identifier in tauri.conf.json
  # is still the old reverse-DNS name, and the single-instance plugin claims a
  # bus name derived from it, so a second launch finds the first window instead
  # of opening its own. A sandbox may only own names under its app ID unless it
  # asks, which is all this asks for. Aligning the identifier would retire it,
  # at the cost of moving every existing install's data directory.
  - --own-name=ch.emilvinu.nib
  - --own-name=ch.emilvinu.nib.*
  # Anything the person picks in a file dialog arrives through the document
  # portal, which needs no permission at all. Documents get a standing one so
  # that reopening what was last edited works without a fresh dialog; wider
  # access than that is a sandbox hole Flathub's linter rejects outright.
  - --filesystem=xdg-documents

modules:
  - name: nib
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin:/run/build/nib/pnpm/bin
      env:
        # The vendored crates and the cargo config that replaces crates.io with
        # them, both written by cargo-sources.json.
        CARGO_HOME: /run/build/nib/cargo
        CARGO_NET_OFFLINE: 'true'
        # Where node-sources.json puts the offline caches. The pnpm store is
        # pointed at by the .npmrc the same file appends.
        XDG_CACHE_HOME: /run/build/nib/flatpak-node/cache
        npm_config_cache: /run/build/nib/flatpak-node/npm-cache
    build-commands:
      - ln -s pnpm.cjs pnpm/bin/pnpm
      # Only the desktop app and the packages it is built from: the Worker under
      # services/ is not part of a Flatpak.
      - pnpm install --offline --frozen-lockfile --filter "@nib/desktop..."
      # A Flatpak is updated by Flathub and must not install anything itself, so
      # the updater is left with nowhere to look. The plugin stays configured -
      # its public key is not optional - and an empty endpoint list is what the
      # app already treats as "nothing new", which is also what it does with no
      # network at all.
      - |
        python3 -c "import json
        path = 'apps/desktop/src-tauri/tauri.conf.json'
        conf = json.load(open(path))
        conf['plugins']['updater']['endpoints'] = []
        conf['bundle']['createUpdaterArtifacts'] = False
        json.dump(conf, open(path, 'w'), indent=2)"
      # The web assets first: the binary embeds apps/desktop/dist at compile
      # time, which is what tauri.conf.json points frontendDist at.
      - pnpm --filter @nib/desktop build
      - cargo build --offline --release --manifest-path apps/desktop/src-tauri/Cargo.toml
      - install -Dm755 apps/desktop/src-tauri/target/release/nib /app/bin/nib
      - install -Dm644 so.orden.Orden.desktop /app/share/applications/so.orden.Orden.desktop
      - install -Dm644 so.orden.Orden.metainfo.xml /app/share/metainfo/so.orden.Orden.metainfo.xml
      # Tauri names the icons after the size it thinks they are; these are the
      # sizes they measure. 128x128@2x.png is a plain 256x256 image.
      - |
        icons=apps/desktop/src-tauri/icons
        install -Dm644 "$icons/32x32.png"      /app/share/icons/hicolor/32x32/apps/so.orden.Orden.png
        install -Dm644 "$icons/64x64.png"      /app/share/icons/hicolor/64x64/apps/so.orden.Orden.png
        install -Dm644 "$icons/128x128.png"    /app/share/icons/hicolor/128x128/apps/so.orden.Orden.png
        install -Dm644 "$icons/128x128@2x.png" /app/share/icons/hicolor/256x256/apps/so.orden.Orden.png
        install -Dm644 "$icons/icon.png"       /app/share/icons/hicolor/512x512/apps/so.orden.Orden.png
    sources:
      - type: git
        url: https://github.com/lxorb/orden.git
        tag: v0.15.0
        commit: 2591eb1344c902122da58051022558957d9609e5
        x-checker-data:
          type: json
          url: https://api.github.com/repos/lxorb/orden/releases/latest
          tag-query: .tag_name
          version-query: $tag | sub("^v"; "")
          is-main-source: true
      # The version in the repository's packageManager field, so pnpm does not
      # go looking for another one.
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-10.28.1.tgz
        sha256: 52128de921542b1faa91c4c7dec5e88c5736ccb6006b879401e90db275ee4719
        dest: pnpm
      - cargo-sources.json
      - node-sources.json
      - type: file
        path: so.orden.Orden.desktop
      - type: file
        path: so.orden.Orden.metainfo.xml
